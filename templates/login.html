<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agent Control — 登录</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #0f1117;
      color: #e6edf3;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .card {
      width: min(360px, 100%);
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 10px;
      padding: 28px 24px;
    }

    h1 {
      font-size: 18px;
      margin-bottom: 8px;
    }

    p {
      font-size: 13px;
      color: #8b949e;
      margin-bottom: 20px;
      line-height: 1.5;
    }

    label {
      display: block;
      font-size: 12px;
      color: #8b949e;
      margin-bottom: 6px;
    }

    input {
      width: 100%;
      background: #0f1117;
      border: 1px solid #30363d;
      color: #e6edf3;
      padding: 10px 12px;
      border-radius: 6px;
      font-size: 14px;
      outline: none;
    }

    input:focus {
      border-color: #58a6ff;
      box-shadow: 0 0 0 1px #58a6ff55;
    }

    button {
      margin-top: 16px;
      width: 100%;
      background: #238636;
      border: none;
      color: #fff;
      padding: 10px 12px;
      border-radius: 6px;
      font-size: 14px;
      cursor: pointer;
    }

    button:hover { background: #2ea043; }

    .error {
      margin-top: 12px;
      color: #f85149;
      font-size: 13px;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Agent Control</h1>
    <p>需要访问令牌才能继续。请输入启动服务时配置的 token。</p>
    <form method="post" action="/login">
      <label for="token">Token</label>
      <input id="token" name="token" type="password" autocomplete="current-password" required autofocus>
      <button type="submit">进入</button>
    </form>
    {% if error %}
    <div class="error">{{ error }}</div>
    {% endif %}
  </div>
</body>
</html>
