<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>Agent Control</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body, #grid, #overlay {
      scrollbar-width: thin;
      scrollbar-color: #1a1a1a #000;
    }

    html::-webkit-scrollbar,
    body::-webkit-scrollbar,
    #grid::-webkit-scrollbar,
    #overlay::-webkit-scrollbar {
      width: 4px;
      height: 4px;
    }

    html::-webkit-scrollbar-track,
    body::-webkit-scrollbar-track,
    #grid::-webkit-scrollbar-track,
    #overlay::-webkit-scrollbar-track {
      background: #000;
    }

    html::-webkit-scrollbar-thumb,
    body::-webkit-scrollbar-thumb,
    #grid::-webkit-scrollbar-thumb,
    #overlay::-webkit-scrollbar-thumb {
      background: #1a1a1a;
      border-radius: 2px;
    }

    html::-webkit-scrollbar-thumb:hover,
    body::-webkit-scrollbar-thumb:hover,
    #grid::-webkit-scrollbar-thumb:hover,
    #overlay::-webkit-scrollbar-thumb:hover {
      background: #333;
    }

    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #0f1117;
      color: #e6edf3;
      min-height: 100vh;
      min-width: 0;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 12px 20px;
      border-bottom: 1px solid #21262d;
      background: #161b22;
      min-width: 0;
    }

    .header-main {
      display: flex;
      align-items: center;
      gap: 16px;
      min-width: 0;
      flex: 1 1 0;
      overflow: hidden;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex: 0 0 auto;
    }

    .header-btn {
      background: #21262d;
      border: 1px solid #30363d;
      color: #e6edf3;
      padding: 6px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 12px;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .header-btn:hover { background: #30363d; }

    .header-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    header h1 {
      font-size: 16px;
      font-weight: 600;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .hint {
      font-size: 12px;
      color: #8b949e;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    #grid {
      display: flex;
      flex-wrap: wrap;
      align-content: flex-start;
      gap: 12px;
      padding: 16px;
      min-height: calc(100vh - 52px);
    }

    #grid.empty {
      place-items: center;
      align-content: center;
    }

    .cell {
      position: relative;
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
      width: 320px;
      height: 240px;
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 8px;
      overflow: hidden;
      cursor: default;
      transition: border-color 0.15s, box-shadow 0.15s;
    }

    .cell.resizing {
      transition: none;
      user-select: none;
    }

    .cell-resize-handle {
      position: absolute;
      right: 0;
      bottom: 0;
      width: 18px;
      height: 18px;
      z-index: 6;
      cursor: nwse-resize;
      touch-action: none;
    }

    .cell-resize-handle::before {
      content: '';
      position: absolute;
      right: 4px;
      bottom: 4px;
      width: 8px;
      height: 8px;
      border-right: 2px solid #484f58;
      border-bottom: 2px solid #484f58;
    }

    .cell-resize-handle:hover::before {
      border-color: #58a6ff;
    }

    .cell.expanded .cell-resize-handle {
      display: none;
    }

    .cell:hover {
      border-color: #58a6ff;
      box-shadow: 0 0 0 1px #58a6ff33;
    }

    .cell-header {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      padding: 6px 10px;
      background: #21262d;
      font-size: 12px;
      color: #8b949e;
      flex-shrink: 0;
      position: relative;
      z-index: 2;
      pointer-events: auto;
    }

    .cell-title-box {
      flex: 1;
      min-width: 0;
    }

    .cell-title-display {
      display: block;
      flex: 1;
      min-width: 0;
      color: #e6edf3 !important;
      font-size: 12px;
      line-height: 1.4;
      padding: 2px 6px;
      cursor: text;
      white-space: pre-wrap;
      word-break: break-word;
      overflow-wrap: anywhere;
      min-height: 22px;
      outline: none;
    }

    .cell-title-display:empty::before {
      content: attr(data-default);
      color: #8b949e;
    }

    .cell-title-display:hover {
      background: #0f111733;
      border-radius: 3px;
    }

    .cell-title-display:focus {
      background: #0f1117;
      box-shadow: 0 0 0 1px #58a6ff;
      border-radius: 3px;
    }

    .tmux-id {
      flex-shrink: 0;
      align-self: flex-start;
      margin-top: 3px;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 10px;
      color: #6e7681;
      background: #0f1117;
      border: 1px solid #30363d;
      border-radius: 3px;
      padding: 1px 5px;
      cursor: default;
      user-select: all;
    }

    .cell-recency-tag {
      display: none;
      flex-shrink: 0;
      align-self: flex-start;
      margin-top: 1px;
      min-width: 18px;
      height: 18px;
      padding: 0 4px;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 12px;
      font-weight: 700;
      line-height: 18px;
      text-align: center;
      color: #8b949e;
      background: #21262d;
      border: 1px solid #30363d;
      border-radius: 4px;
      font-variant-numeric: tabular-nums;
      user-select: none;
    }

    .cell-recency-tag.has-tag {
      display: inline-block;
    }

    .cell-recency-tag.is-latest {
      color: #fff;
      background: #238636;
      border-color: #2ea043;
    }

    .overlay-recency-tag {
      display: none;
      flex-shrink: 0;
      align-self: flex-start;
      margin-top: 4px;
      min-width: 22px;
      height: 24px;
      padding: 0 6px;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 14px;
      font-weight: 700;
      line-height: 24px;
      text-align: center;
      color: #8b949e;
      background: #21262d;
      border: 1px solid #30363d;
      border-radius: 4px;
      font-variant-numeric: tabular-nums;
      user-select: none;
    }

    .overlay-recency-tag.has-tag {
      display: inline-block;
    }

    .overlay-recency-tag.is-latest {
      color: #fff;
      background: #238636;
      border-color: #2ea043;
    }

    .overlay-title {
      flex: 1;
      min-width: 0;
      background: #0f1117;
      border: 1px solid #30363d;
      color: #e6edf3;
      font-size: 14px;
      line-height: 1.4;
      outline: none;
      padding: 4px 8px;
      resize: none;
      white-space: pre-wrap;
      word-break: break-word;
      overflow-wrap: anywhere;
      cursor: text;
      width: 100%;
      min-height: 28px;
      border-radius: 3px;
      box-sizing: border-box;
    }

    .cell-actions {
      display: flex;
      align-items: flex-start;
      gap: 2px;
      flex-shrink: 0;
    }

    .btn-icon {
      flex-shrink: 0;
      align-self: flex-start;
      margin-top: 1px;
      background: none;
      border: none;
      color: #8b949e;
      cursor: pointer;
      font-size: 14px;
      line-height: 1;
      padding: 0 4px;
    }

    .btn-icon:hover { color: #e6edf3; }

    .btn-maximize:hover { color: #58a6ff; }

    .btn-drag {
      font-size: 12px;
      letter-spacing: -1px;
      cursor: grab;
      touch-action: none;
    }

    .btn-drag:hover { color: #d2a8ff; }

    .btn-drag:active { cursor: grabbing; }

    .cell.dragging {
      opacity: 0.55;
      border-color: #d2a8ff;
      box-shadow: 0 0 0 1px #d2a8ff55;
    }

    .cell.drag-over {
      border-color: #d2a8ff;
      box-shadow: 0 0 0 2px #d2a8ff66;
    }

    .btn-close {
      font-size: 16px;
    }

    .btn-close:hover { color: #f85149; }

    .terminal-viewport {
      flex: 1;
      min-height: 0;
      overflow: hidden;
      position: relative;
      background: #000;
    }

    .terminal-frame {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      transform-origin: top left;
    }

    .terminal-frame iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
      background: #000;
      pointer-events: auto;
    }

    .cell.minimized .terminal-frame iframe {
      pointer-events: none;
    }

    .cell.minimized-active .terminal-frame iframe {
      pointer-events: auto;
    }

    .terminal-activator {
      display: none;
      position: absolute;
      inset: 0;
      z-index: 4;
      border: none;
      padding: 0;
      background: rgba(0, 0, 0, 0.5);
      color: #8b949e;
      font-size: 12px;
      cursor: pointer;
    }

    .cell.minimized:not(.minimized-active) .terminal-activator {
      display: block;
    }

    body.session-expanded {
      overflow: hidden;
    }

    /* iframe 会突破 z-index，最大化时隐藏其余格子 */
    body.session-expanded #grid .cell:not(.expanded),
    body.session-expanded #grid .cell-placeholder {
      visibility: hidden;
      pointer-events: none;
    }

    body.session-expanded #grid .cell.expanded {
      visibility: visible;
      pointer-events: auto;
    }

    .cell-placeholder {
      flex-shrink: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .cell.expanded {
      position: fixed;
      top: var(--overlay-bar-height, 49px);
      left: 0;
      right: 0;
      bottom: 0;
      width: 100vw !important;
      height: auto !important;
      z-index: 90;
      aspect-ratio: unset;
      border-radius: 0;
      border: none;
      cursor: default;
    }

    .cell.expanded:hover {
      border-color: transparent;
      box-shadow: none;
    }

    .cell.expanded .cell-header {
      display: none;
    }

    .cell.expanded .terminal-viewport {
      flex: 1;
    }

    .cell.expanded .terminal-frame {
      position: absolute;
      top: 0;
      left: 0;
    }

    .cell.expanded .terminal-frame iframe {
      pointer-events: auto;
    }

    .fab {
      position: fixed;
      right: 24px;
      bottom: 24px;
      width: 56px;
      height: 56px;
      border-radius: 50%;
      border: none;
      background: #238636;
      color: #fff;
      font-size: 32px;
      line-height: 1;
      cursor: pointer;
      box-shadow: 0 4px 16px #0008;
      transition: transform 0.15s, background 0.15s;
      z-index: 10;
    }

    .fab:hover {
      background: #2ea043;
      transform: scale(1.05);
    }

    .fab:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }

    /* fullscreen overlay — bar only; iframe stays in its cell */
    #overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 100;
      pointer-events: none;
    }

    #overlay.active { display: block; }

    .overlay-bar {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      padding: 10px 16px;
      background: #161b22;
      border-bottom: 1px solid #21262d;
      pointer-events: auto;
    }

    .overlay-bar span {
      display: none;
    }

    .overlay-actions { display: flex; gap: 8px; }

    .overlay-actions button {
      background: #21262d;
      border: 1px solid #30363d;
      color: #e6edf3;
      padding: 6px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 13px;
    }

    .overlay-actions button:hover { background: #30363d; }

    .overlay-body { display: none; }

    .empty-msg {
      text-align: center;
      color: #8b949e;
    }

    .empty-msg p { margin-top: 8px; font-size: 14px; }

    .toast {
      position: fixed;
      bottom: 90px;
      right: 24px;
      background: #da3633;
      color: #fff;
      padding: 10px 16px;
      border-radius: 6px;
      font-size: 13px;
      display: none;
      z-index: 200;
      max-width: 360px;
    }

    .toast.show { display: block; }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.55);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 150;
      padding: 24px;
    }

    .modal-backdrop.active { display: flex; }

    .modal {
      width: min(420px, 100%);
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 10px;
      box-shadow: 0 16px 48px rgba(0, 0, 0, 0.45);
      overflow: hidden;
    }

    .modal-header {
      padding: 16px 18px 8px;
      font-size: 16px;
      font-weight: 600;
      color: #e6edf3;
    }

    .modal-body {
      padding: 8px 18px 16px;
      color: #8b949e;
      font-size: 13px;
    }

    .tmux-options {
      margin-top: 12px;
      max-height: 220px;
      overflow-y: auto;
      border: 1px solid #21262d;
      border-radius: 8px;
      background: #0d1117;
    }

    .tmux-option {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 12px;
      border-bottom: 1px solid #21262d;
      cursor: pointer;
      color: #e6edf3;
    }

    .tmux-option:last-child { border-bottom: none; }

    .tmux-option:hover { background: #161b22; }

    .tmux-option input { accent-color: #238636; }

    .tmux-option-meta {
      margin-left: auto;
      font-size: 11px;
      color: #8b949e;
    }

    .tmux-empty {
      padding: 14px 12px;
      color: #8b949e;
      font-size: 13px;
    }

    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      padding: 12px 18px 16px;
      border-top: 1px solid #21262d;
    }

    .modal-actions button {
      background: #21262d;
      border: 1px solid #30363d;
      color: #e6edf3;
      padding: 8px 14px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 13px;
    }

    .modal-actions button:hover { background: #30363d; }

    .modal-actions button.primary {
      background: #238636;
      border-color: #238636;
      color: #fff;
    }

    .modal-actions button.primary:hover { background: #2ea043; }

    .modal-actions button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    /* --- Mobile layout --- */
    .mobile-only { display: none; }

    .overview-tap-catcher {
      display: none;
      position: absolute;
      inset: 0;
      z-index: 5;
      border: none;
      padding: 0;
      margin: 0;
      background: transparent;
      cursor: pointer;
    }

    .mobile-pager-top,
    .mobile-pager-bottom {
      display: none;
      position: fixed;
      left: 0;
      right: 0;
      z-index: 120;
      background: #161b22;
      border-color: #21262d;
      touch-action: pan-y;
    }

    .mobile-pager-top {
      top: 0;
      align-items: center;
      gap: 10px;
      padding: max(8px, env(safe-area-inset-top)) 12px 8px;
      border-bottom: 1px solid #21262d;
      min-height: 48px;
    }

    .mobile-pager-bottom {
      bottom: 0;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 10px 16px max(10px, env(safe-area-inset-bottom));
      border-top: 1px solid #21262d;
      min-height: 52px;
    }

    .mobile-pager-back {
      flex-shrink: 0;
      background: #21262d;
      border: 1px solid #30363d;
      color: #e6edf3;
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 13px;
      cursor: pointer;
    }

    .mobile-pager-title {
      flex: 1;
      min-width: 0;
      font-size: 14px;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .mobile-pager-dots {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }

    .mobile-pager-dot {
      width: 8px;
      height: 8px;
      padding: 0;
      border: none;
      border-radius: 50%;
      background: #484f58;
      cursor: pointer;
    }

    .mobile-pager-dot.active {
      background: #58a6ff;
      transform: scale(1.15);
    }

    .mobile-pager-nav {
      background: #21262d;
      border: 1px solid #30363d;
      color: #e6edf3;
      width: 44px;
      height: 44px;
      border-radius: 8px;
      font-size: 22px;
      line-height: 1;
      cursor: pointer;
    }

    .mobile-pager-nav:disabled {
      opacity: 0.35;
      cursor: not-allowed;
    }

    .mobile-pager-index {
      font-size: 13px;
      color: #8b949e;
      min-width: 64px;
      text-align: center;
    }

    .mobile-pager-settings {
      flex-shrink: 0;
      background: #21262d;
      border: 1px solid #30363d;
      color: #e6edf3;
      padding: 6px 10px;
      border-radius: 6px;
      font-size: 13px;
      cursor: pointer;
    }

    .settings-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-top: 14px;
    }

    .settings-row-label {
      font-size: 13px;
      color: #e6edf3;
    }

    .settings-row-hint {
      margin-top: 8px;
      font-size: 12px;
      color: #8b949e;
      line-height: 1.5;
    }

    .font-size-controls {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .font-size-btn {
      background: #21262d;
      border: 1px solid #30363d;
      color: #e6edf3;
      min-width: 36px;
      height: 36px;
      padding: 0 8px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      line-height: 1;
      cursor: pointer;
    }

    .font-size-btn:disabled {
      opacity: 0.35;
      cursor: not-allowed;
    }

    .font-size-input {
      width: 52px;
      height: 36px;
      padding: 0 4px;
      border: 1px solid #30363d;
      border-radius: 8px;
      background: #0d1117;
      color: #e6edf3;
      font-size: 13px;
      text-align: center;
      font-variant-numeric: tabular-nums;
      -moz-appearance: textfield;
    }

    .font-size-input::-webkit-outer-spin-button,
    .font-size-input::-webkit-inner-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }

    .font-size-input:focus {
      outline: none;
      border-color: #58a6ff;
      box-shadow: 0 0 0 1px #58a6ff55;
    }

    @media (max-width: 768px) {
      .mobile-only { display: inline-flex; }

      html, body {
        overflow-x: hidden;
        max-width: 100%;
      }

      header {
        width: 100%;
        max-width: 100vw;
        box-sizing: border-box;
        padding: 8px 10px;
        padding-top: max(8px, env(safe-area-inset-top));
        gap: 8px;
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        align-items: center;
      }

      .header-main {
        gap: 0;
        min-width: 0;
        overflow: hidden;
      }

      header h1 {
        font-size: 12px;
        max-width: 100%;
      }

      .hint,
      #resetLayoutBtn,
      .header-main {
        display: none !important;
      }

      header {
        grid-template-columns: 1fr;
        justify-items: end;
      }

      .header-actions {
        gap: 6px;
        justify-self: end;
      }

      .header-btn {
        padding: 8px 12px;
        font-size: 12px;
        min-height: 36px;
      }

      #grid {
        width: 100%;
        max-width: 100vw;
        box-sizing: border-box;
        overflow-x: hidden;
      }

      #grid .cell {
        width: 100% !important;
        max-width: 100%;
        box-sizing: border-box;
      }

      body.mobile {
        overflow: hidden;
      }

      body.mobile header {
        padding: 8px 10px;
        padding-top: max(8px, env(safe-area-inset-top));
      }

      body.mobile header h1 {
        font-size: 12px;
      }

      body.mobile .hint,
      body.mobile #resetLayoutBtn,
      body.mobile .btn-drag,
      body.mobile .btn-maximize,
      body.mobile .cell-resize-handle {
        display: none !important;
      }

      body.mobile .fab {
        right: 16px;
        bottom: max(80px, calc(16px + env(safe-area-inset-bottom)));
        width: 52px;
        height: 52px;
        font-size: 28px;
      }

      body.mobile.mobile-overview #grid {
        display: flex;
        flex-direction: column;
        flex-wrap: nowrap;
        align-content: stretch;
        gap: 10px;
        padding: 12px;
        padding-bottom: max(88px, calc(12px + env(safe-area-inset-bottom)));
        overflow-x: hidden;
        overflow-y: auto;
        height: calc(100vh - 52px);
        height: calc(100dvh - 52px);
        min-height: 0;
        -webkit-overflow-scrolling: touch;
      }

      body.mobile.mobile-overview #grid.empty {
        place-items: center;
        justify-content: center;
      }

      body.mobile.mobile-overview .cell {
        width: 100% !important;
        height: 38vh !important;
        height: 38dvh !important;
        min-height: 200px;
        max-height: 320px;
        flex-shrink: 0;
      }

      body.mobile.mobile-overview .overview-tap-catcher {
        display: block;
      }

      body.mobile.mobile-overview .cell.minimized .terminal-activator {
        display: none;
      }

      body.mobile.mobile-pager {
        overflow: hidden;
      }

      body.mobile.mobile-pager header {
        display: none;
      }

      body.mobile.mobile-pager .mobile-pager-top,
      body.mobile.mobile-pager .mobile-pager-bottom {
        display: flex;
      }

      body.mobile.mobile-pager .fab {
        bottom: max(68px, calc(12px + env(safe-area-inset-bottom)));
      }

      body.mobile.mobile-pager #grid {
        display: flex;
        flex-direction: row;
        flex-wrap: nowrap;
        align-content: stretch;
        gap: 0;
        padding: 0;
        margin: 0;
        position: fixed;
        top: 48px;
        top: calc(48px + env(safe-area-inset-top));
        bottom: 52px;
        bottom: calc(52px + env(safe-area-inset-bottom));
        left: 0;
        right: 0;
        width: 100%;
        height: auto;
        min-height: 0;
        overflow-x: auto;
        overflow-y: hidden;
        scroll-snap-type: x mandatory;
        -webkit-overflow-scrolling: touch;
        scrollbar-width: none;
      }

      body.mobile.mobile-pager #grid::-webkit-scrollbar {
        display: none;
      }

      body.mobile.mobile-pager .cell {
        width: 100vw !important;
        height: 100% !important;
        min-height: 0;
        max-height: none;
        flex-shrink: 0;
        scroll-snap-align: start;
        scroll-snap-stop: always;
        border-radius: 0;
        border-left: none;
        border-right: none;
      }

      body.mobile.mobile-pager .cell-header {
        display: none;
      }

      body.mobile.mobile-pager .overview-tap-catcher {
        display: none !important;
      }

      body.mobile.mobile-pager .cell .terminal-frame iframe {
        pointer-events: auto;
      }

      body.mobile #overlay {
        display: none !important;
      }
    }
  </style>
</head>
<body>
  <header>
    <div class="header-main">
      <h1>Agent Control</h1>
      <span class="hint">拖动 ⠿ 排序 · 右下角拖大窗口 · ⤢ 放大 · Esc 最小化</span>
    </div>
    <div class="header-actions">
      <button type="button" class="header-btn mobile-only" id="mobileOverviewBtn" title="返回总览">总览</button>
      <button type="button" class="header-btn" id="settingsBtn" title="设置">设置</button>
      <button type="button" class="header-btn" id="resetLayoutBtn" title="所有窗口恢复默认大小">重置窗口</button>
    </div>
  </header>

  <div class="mobile-pager-top" id="mobilePagerTop">
    <button type="button" class="mobile-pager-back" id="mobileBackBtn">总览</button>
    <span class="mobile-pager-title" id="mobilePagerTitle"></span>
    <div class="mobile-pager-dots" id="mobilePagerDots"></div>
    <button type="button" class="mobile-pager-settings" id="mobileSettingsBtn" title="设置">设置</button>
  </div>

  <div class="mobile-pager-bottom" id="mobilePagerBottom">
    <button type="button" class="mobile-pager-nav" id="mobilePrevBtn" aria-label="上一个 session">‹</button>
    <span class="mobile-pager-index" id="mobilePagerIndex"></span>
    <button type="button" class="mobile-pager-nav" id="mobileNextBtn" aria-label="下一个 session">›</button>
  </div>

  <div id="grid" class="empty">
    <div class="empty-msg">
      <div style="font-size:48px;opacity:0.3">+</div>
      <p>点击右下角加号创建终端 session</p>
    </div>
  </div>

  <button class="fab" id="addBtn" title="新建 session">+</button>

  <div id="overlay">
    <div class="overlay-bar">
      <span id="overlayRecencyTag" class="overlay-recency-tag" aria-label="操作序号"></span>
      <textarea id="overlayTitle" class="overlay-title" rows="1" placeholder="点击输入备注..."></textarea>
      <div class="overlay-actions">
        <button id="exitBtn">最小化 (Esc)</button>
      </div>
    </div>
    <div class="overlay-body"></div>
  </div>

  <div class="toast" id="toast"></div>

  <div class="modal-backdrop" id="settingsModal">
    <div class="modal" role="dialog" aria-labelledby="settingsModalTitle">
      <div class="modal-header" id="settingsModalTitle">设置</div>
      <div class="modal-body">
        <div class="settings-row">
          <span class="settings-row-label">终端字号</span>
          <div class="font-size-controls">
            <button type="button" class="font-size-btn" id="settingsFontDown" aria-label="减小终端字体">A−</button>
            <input type="number" class="font-size-input" id="settingsFontSizeInput" inputmode="numeric" min="6" max="24" step="1" aria-label="终端字号">
            <button type="button" class="font-size-btn" id="settingsFontUp" aria-label="增大终端字体">A+</button>
          </div>
        </div>
        <p class="settings-row-hint">范围 6–24，对所有 tmux 终端生效。调整完成后点击「完成」才会重载终端页面。</p>
      </div>
      <div class="modal-actions">
        <button type="button" class="primary" id="settingsCloseBtn">完成</button>
      </div>
    </div>
  </div>

  <div class="modal-backdrop" id="createModal">
    <div class="modal" role="dialog" aria-labelledby="createModalTitle">
      <div class="modal-header" id="createModalTitle">新建 session</div>
      <div class="modal-body">
        <p>选择复用已有 tmux session，或新建一个。</p>
        <div class="tmux-options" id="tmuxOptions">
          <label class="tmux-option">
            <input type="radio" name="tmuxChoice" value="" checked>
            <span>新建 tmux session</span>
          </label>
        </div>
      </div>
      <div class="modal-actions">
        <button type="button" id="createCancelBtn">取消</button>
        <button type="button" class="primary" id="createConfirmBtn">创建</button>
      </div>
    </div>
  </div>

  <script>
    const initialSessions = {{ initial_sessions | tojson }};
    const fetchOpts = { cache: 'no-store', credentials: 'same-origin' };
    const grid = document.getElementById('grid');
    const addBtn = document.getElementById('addBtn');
    const resetLayoutBtn = document.getElementById('resetLayoutBtn');
    const settingsBtn = document.getElementById('settingsBtn');
    const settingsModal = document.getElementById('settingsModal');
    const settingsFontDown = document.getElementById('settingsFontDown');
    const settingsFontUp = document.getElementById('settingsFontUp');
    const settingsFontSizeInput = document.getElementById('settingsFontSizeInput');
    const settingsCloseBtn = document.getElementById('settingsCloseBtn');
    const overlay = document.getElementById('overlay');
    const overlayTitle = document.getElementById('overlayTitle');
    const overlayRecencyTag = document.getElementById('overlayRecencyTag');
    const exitBtn = document.getElementById('exitBtn');
    const toast = document.getElementById('toast');
    const createModal = document.getElementById('createModal');
    const tmuxOptions = document.getElementById('tmuxOptions');
    const createCancelBtn = document.getElementById('createCancelBtn');
    const createConfirmBtn = document.getElementById('createConfirmBtn');
    const mobileOverviewBtn = document.getElementById('mobileOverviewBtn');
    const mobilePagerTop = document.getElementById('mobilePagerTop');
    const mobilePagerBottom = document.getElementById('mobilePagerBottom');
    const mobileBackBtn = document.getElementById('mobileBackBtn');
    const mobilePagerTitle = document.getElementById('mobilePagerTitle');
    const mobilePagerDots = document.getElementById('mobilePagerDots');
    const mobilePrevBtn = document.getElementById('mobilePrevBtn');
    const mobileNextBtn = document.getElementById('mobileNextBtn');
    const mobilePagerIndexEl = document.getElementById('mobilePagerIndex');
    const mobileSettingsBtn = document.getElementById('mobileSettingsBtn');

    const FONT_SIZE_KEY = 'tmux_ctl_font_size';
    const FONT_SIZE_MIN = 6;
    const FONT_SIZE_MAX = 24;
    const FONT_SIZE_STEP = 1;
    const FONT_SIZE_DEFAULT_DESKTOP = 14;
    const FONT_SIZE_DEFAULT_MOBILE = 16;

    let activeView = null;
    let isMobile = false;
    let mobilePagerIndex = 0;
    let mobileSwipeStartX = 0;
    const MOBILE_SWIPE_THRESHOLD = 40;
    const mobileQuery = window.matchMedia('(max-width: 768px) and (pointer: coarse)');

    function gridCells() {
      return [...grid.querySelectorAll('.cell')];
    }

    // 按「最近操作顺序」排列的 session id 列表（最近在前 = 0）
    let recencyOrder = [];

    function bumpRecency(sessionId) {
      if (!sessionId) return;
      const idx = recencyOrder.indexOf(sessionId);
      if (idx === 0) return;
      if (idx > 0) recencyOrder.splice(idx, 1);
      recencyOrder.unshift(sessionId);
      updateRecencyTags();
    }

    function removeRecency(sessionId) {
      const idx = recencyOrder.indexOf(sessionId);
      if (idx >= 0) {
        recencyOrder.splice(idx, 1);
        updateRecencyTags();
      }
    }

    function mergeRecencyAfterRender(sessionIds) {
      const alive = new Set(sessionIds);
      recencyOrder = recencyOrder.filter((id) => alive.has(id));
    }

    function updateRecencyTags() {
      gridCells().forEach((cell) => {
        const tagEl = cell.querySelector('.cell-recency-tag');
        if (!tagEl) return;
        const rank = recencyOrder.indexOf(cell.dataset.id);
        if (rank < 0) {
          tagEl.classList.remove('has-tag', 'is-latest');
          tagEl.textContent = '';
        } else {
          tagEl.classList.add('has-tag');
          tagEl.classList.toggle('is-latest', rank === 0);
          tagEl.textContent = String(rank);
        }
      });
      updateOverlayRecencyTag();
    }

    function updateOverlayRecencyTag() {
      if (!overlayRecencyTag) return;
      const id = activeView?.session?.id;
      const rank = id ? recencyOrder.indexOf(id) : -1;
      if (rank < 0) {
        overlayRecencyTag.classList.remove('has-tag', 'is-latest');
        overlayRecencyTag.textContent = '';
      } else {
        overlayRecencyTag.classList.add('has-tag');
        overlayRecencyTag.classList.toggle('is-latest', rank === 0);
        overlayRecencyTag.textContent = String(rank);
      }
    }

    function buildTtydUrl(baseUrl, fontSize) {
      try {
        const url = new URL(baseUrl, window.location.origin);
        url.searchParams.set('fontSize', String(fontSize));
        return url.href;
      } catch {
        const sep = baseUrl.includes('?') ? '&' : '?';
        return `${baseUrl}${sep}fontSize=${fontSize}`;
      }
    }

    function getTerminalFontSize() {
      const stored = localStorage.getItem(FONT_SIZE_KEY);
      if (stored !== null) {
        const value = parseInt(stored, 10);
        if (Number.isFinite(value)) {
          return Math.max(FONT_SIZE_MIN, Math.min(FONT_SIZE_MAX, value));
        }
      }
      return isMobile ? FONT_SIZE_DEFAULT_MOBILE : FONT_SIZE_DEFAULT_DESKTOP;
    }

    function normalizeTtydBaseUrl(url) {
      try {
        const parsed = new URL(url, window.location.origin);
        parsed.searchParams.delete('fontSize');
        const qs = parsed.searchParams.toString();
        return qs ? `${parsed.origin}${parsed.pathname}?${qs}` : `${parsed.origin}${parsed.pathname}`;
      } catch {
        return url.replace(/([?&])fontSize=\d+(&|$)/, (_, sep, tail) => (tail ? sep : '')).replace(/[?&]$/, '');
      }
    }

    function clampFontSize(size) {
      return Math.max(FONT_SIZE_MIN, Math.min(FONT_SIZE_MAX, size));
    }

    function readDraftFontSize() {
      const raw = settingsFontSizeInput.value.trim();
      const value = parseInt(raw, 10);
      if (!Number.isFinite(value)) return getTerminalFontSize();
      return clampFontSize(value);
    }

    function updateFontSizeControls(draftSize) {
      const size = draftSize !== undefined ? clampFontSize(draftSize) : getTerminalFontSize();
      settingsFontSizeInput.value = String(size);
      settingsFontDown.disabled = size <= FONT_SIZE_MIN;
      settingsFontUp.disabled = size >= FONT_SIZE_MAX;
    }

    function changeDraftFontSize(delta) {
      const next = clampFontSize(readDraftFontSize() + delta * FONT_SIZE_STEP);
      updateFontSizeControls(next);
    }

    function applySettingsFontSize() {
      const raw = settingsFontSizeInput.value.trim();
      const value = parseInt(raw, 10);
      if (!Number.isFinite(value)) {
        showToast(`请输入 ${FONT_SIZE_MIN}–${FONT_SIZE_MAX} 之间的整数`);
        updateFontSizeControls(getTerminalFontSize());
        return false;
      }
      const clamped = clampFontSize(value);
      const prev = getTerminalFontSize();
      localStorage.setItem(FONT_SIZE_KEY, String(clamped));
      updateFontSizeControls(clamped);
      if (clamped !== prev) {
        applyFontSizeToAllIframes(clamped);
        showToast(`终端字号: ${clamped}`);
      }
      return true;
    }

    function openSettingsModal() {
      updateFontSizeControls(getTerminalFontSize());
      settingsModal.classList.add('active');
    }

    function confirmSettingsModal() {
      if (!applySettingsFontSize()) return;
      settingsModal.classList.remove('active');
    }

    function cancelSettingsModal() {
      updateFontSizeControls(getTerminalFontSize());
      settingsModal.classList.remove('active');
    }

    function applyFontSizeToAllIframes(fontSize) {
      grid.querySelectorAll('.cell iframe').forEach((iframe) => {
        if (!iframe.dataset.ttydBase) {
          iframe.dataset.ttydBase = normalizeTtydBaseUrl(iframe.src);
        }
        const nextSrc = buildTtydUrl(iframe.dataset.ttydBase, fontSize);
        if (iframe.src !== nextSrc) {
          iframe.src = nextSrc;
        }
      });
      requestAnimationFrame(() => {
        if (document.body.classList.contains('mobile-pager')) {
          setMobilePagerIndex(mobilePagerIndex, false);
        } else {
          refreshAllCellFrames();
        }
      });
    }

    function initTerminalIframe(iframe, baseUrl) {
      iframe.dataset.ttydBase = normalizeTtydBaseUrl(baseUrl);
      iframe.src = buildTtydUrl(iframe.dataset.ttydBase, getTerminalFontSize());
    }

    function refreshAllCellFrames() {
      gridCells().forEach((cell) => {
        fitFrameToGrid(cell);
      });
    }

    function renderMobilePagerDots() {
      mobilePagerDots.innerHTML = '';
      gridCells().forEach((cell, i) => {
        const dot = document.createElement('button');
        dot.type = 'button';
        dot.className = 'mobile-pager-dot';
        if (i === mobilePagerIndex) dot.classList.add('active');
        dot.setAttribute('aria-label', `Session ${i + 1}`);
        dot.addEventListener('click', () => setMobilePagerIndex(i));
        mobilePagerDots.appendChild(dot);
      });
    }

    function updateMobilePagerChrome() {
      const cells = gridCells();
      if (!cells.length) {
        mobilePagerTitle.textContent = '';
        mobilePagerIndexEl.textContent = '';
        return;
      }
      mobilePagerIndex = Math.max(0, Math.min(mobilePagerIndex, cells.length - 1));
      const cell = cells[mobilePagerIndex];
      const titleEl = cell.querySelector('.cell-title-display');
      const baseTitle = (titleEl?.textContent || '').trim() || `session-${mobilePagerIndex + 1}`;
      const rank = recencyOrder.indexOf(cell.dataset.id);
      mobilePagerTitle.textContent = rank >= 0 ? `${rank} · ${baseTitle}` : baseTitle;
      mobilePagerIndexEl.textContent = `${mobilePagerIndex + 1} / ${cells.length}`;
      mobilePagerDots.querySelectorAll('.mobile-pager-dot').forEach((dot, i) => {
        dot.classList.toggle('active', i === mobilePagerIndex);
      });
      mobilePrevBtn.disabled = mobilePagerIndex <= 0;
      mobileNextBtn.disabled = mobilePagerIndex >= cells.length - 1;
    }

    function setMobilePagerIndex(index, smooth = true) {
      const cells = gridCells();
      if (!cells.length) return;
      mobilePagerIndex = Math.max(0, Math.min(index, cells.length - 1));
      const cell = cells[mobilePagerIndex];
      bumpRecency(cell.dataset.id);
      cell.scrollIntoView({
        behavior: smooth ? 'smooth' : 'auto',
        inline: 'start',
        block: 'nearest',
      });
      requestAnimationFrame(() => {
        fitFrameToGrid(cell);
        cell.classList.remove('minimized');
        cell.classList.remove('minimized-active');
        updateMobilePagerChrome();
      });
    }

    function goMobilePager(delta) {
      setMobilePagerIndex(mobilePagerIndex + delta);
    }

    function enterMobilePager(cell) {
      if (!isMobile) return;
      const cells = gridCells();
      const index = cells.indexOf(cell);
      if (index < 0) return;
      if (activeView) minimizeSession();
      document.body.classList.remove('mobile-overview');
      document.body.classList.add('mobile-pager');
      mobileOverviewBtn.style.display = 'inline-flex';
      mobilePagerIndex = index;
      renderMobilePagerDots();
      requestAnimationFrame(() => {
        setMobilePagerIndex(index, false);
      });
    }

    function exitMobilePager() {
      if (!isMobile) return;
      document.body.classList.remove('mobile-pager');
      document.body.classList.add('mobile-overview');
      mobileOverviewBtn.style.display = 'none';
      grid.scrollTop = 0;
      requestAnimationFrame(refreshAllCellFrames);
    }

    function applyMobileMode() {
      isMobile = mobileQuery.matches;
      if (isMobile) {
        document.body.classList.add('mobile');
        if (!document.body.classList.contains('mobile-pager')) {
          document.body.classList.add('mobile-overview');
          document.body.classList.remove('mobile-pager');
          mobileOverviewBtn.style.display = 'none';
        } else {
          mobileOverviewBtn.style.display = 'inline-flex';
        }
        if (activeView) minimizeSession();
        requestAnimationFrame(refreshAllCellFrames);
        setCellsDraggable(false);
        return;
      }

      document.body.classList.remove('mobile', 'mobile-overview', 'mobile-pager');
      mobileOverviewBtn.style.display = 'none';
      setCellsDraggable(true);
      if (activeView) {
        requestAnimationFrame(() => fitFrameToGrid(activeView.cell));
      } else {
        requestAnimationFrame(refreshAllCellFrames);
      }
    }

    function attachMobileSwipeNav(el) {
      el.addEventListener('touchstart', (e) => {
        if (e.touches.length !== 1) return;
        mobileSwipeStartX = e.touches[0].clientX;
      }, { passive: true });

      el.addEventListener('touchend', (e) => {
        if (!document.body.classList.contains('mobile-pager')) return;
        const dx = e.changedTouches[0].clientX - mobileSwipeStartX;
        if (Math.abs(dx) < MOBILE_SWIPE_THRESHOLD) return;
        if (dx < 0) goMobilePager(1);
        else goMobilePager(-1);
      }, { passive: true });
    }

    function showToast(msg) {
      toast.textContent = msg;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 4000);
    }

    function updateEmptyState() {
      const cells = grid.querySelectorAll('.cell');
      const emptyMsg = grid.querySelector('.empty-msg');
      if (cells.length === 0) {
        grid.classList.add('empty');
        if (!emptyMsg) {
          const div = document.createElement('div');
          div.className = 'empty-msg';
          div.innerHTML = '<div style="font-size:48px;opacity:0.3">+</div><p>点击右下角加号创建终端 session</p>';
          grid.appendChild(div);
        }
      } else {
        grid.classList.remove('empty');
        if (emptyMsg) emptyMsg.remove();
      }
    }

    function defaultLabel(session, index) {
      const title = (session.title || '').trim();
      const fallback = (session.defaultTitle || '').trim() || `session-${index + 1}`;
      return title || fallback;
    }

    function normalizeSession(session, index) {
      const fallback = (session.defaultTitle || '').trim() || `session-${index + 1}`;
      session.defaultTitle = fallback;
      session.title = (session.title || '').trim() || fallback;
      session.width = clampCellSize(
        session.width, MIN_CELL_WIDTH, MAX_CELL_WIDTH, DEFAULT_CELL_WIDTH
      );
      session.height = clampCellSize(
        session.height, MIN_CELL_HEIGHT, MAX_CELL_HEIGHT, DEFAULT_CELL_HEIGHT
      );
      return session;
    }

    async function saveSessionTitle(session, rawTitle, sourceEl) {
      const fallback = session.defaultTitle || 'session-1';
      const value = (rawTitle || '').trim() || fallback;
      if (sourceEl) sourceEl.textContent = value;
      session.title = value;

      const res = await fetch(`/api/sessions/${session.id}`, {
        ...fetchOpts,
        method: 'PATCH',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ title: value }),
      });
      if (!res.ok) {
        showToast('保存备注失败');
        return false;
      }

      const data = await res.json();
      session.title = data.title || value;
      session.defaultTitle = data.defaultTitle || session.defaultTitle;

      const cell = grid.querySelector(`.cell[data-id="${session.id}"]`);
      const cellTitle = cell?.querySelector('.cell-title-display');
      if (cellTitle && cellTitle !== sourceEl) {
        cellTitle.textContent = session.title;
      }
      if (overlayTitle !== sourceEl && activeView?.session.id === session.id) {
        overlayTitle.value = session.title;
      }
      if (isMobile && document.body.classList.contains('mobile-pager')) {
        updateMobilePagerChrome();
      }
      return true;
    }

    function attachTitleEditor(session, el) {
      el.addEventListener('blur', () => saveSessionTitle(session, el.textContent, el));
      el.addEventListener('keydown', (e) => {
        e.stopPropagation();
        if (e.key === 'Enter' && !e.shiftKey) {
          e.preventDefault();
          el.blur();
        }
      });
      el.addEventListener('click', (e) => e.stopPropagation());
      el.addEventListener('dblclick', (e) => e.stopPropagation());
    }

    function gridSessionOrder() {
      return [...grid.querySelectorAll('.cell')].map((cell) => cell.dataset.id);
    }

    let orderSaveTimer = null;

    async function persistSessionOrder() {
      const order = gridSessionOrder();
      if (!order.length) return;
      try {
        const res = await fetch('/api/sessions/order', {
          ...fetchOpts,
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ order }),
        });
        if (!res.ok) {
          const data = await res.json().catch(() => ({}));
          showToast(data.error || '保存排序失败');
        }
      } catch (err) {
        showToast('保存排序失败: ' + err.message);
      }
    }

    function schedulePersistSessionOrder() {
      clearTimeout(orderSaveTimer);
      orderSaveTimer = setTimeout(persistSessionOrder, 300);
    }

    function shouldInsertBefore(dragging, target, x, y) {
      const rect = target.getBoundingClientRect();
      const midX = rect.left + rect.width / 2;
      const midY = rect.top + rect.height / 2;
      const rowThreshold = rect.height * 0.25;
      if (y < midY - rowThreshold) return true;
      if (y > midY + rowThreshold) return false;
      return x < midX;
    }

    function attachDragReorder(cell) {
      const handle = cell.querySelector('.btn-drag');
      if (!handle) return;

      let dragAllowed = false;

      handle.addEventListener('pointerdown', (e) => {
        e.stopPropagation();
        dragAllowed = true;
        handle.setPointerCapture(e.pointerId);
      });

      handle.addEventListener('pointerup', (e) => {
        e.stopPropagation();
        dragAllowed = false;
        if (handle.hasPointerCapture(e.pointerId)) {
          handle.releasePointerCapture(e.pointerId);
        }
      });

      handle.addEventListener('click', (e) => e.stopPropagation());

      cell.addEventListener('dragstart', (e) => {
        if (isMobile) {
          e.preventDefault();
          return;
        }
        if (!dragAllowed) {
          e.preventDefault();
          return;
        }
        e.dataTransfer.effectAllowed = 'move';
        e.dataTransfer.setData('text/plain', cell.dataset.id);
        cell.classList.add('dragging');
        if (e.dataTransfer.setDragImage) {
          e.dataTransfer.setDragImage(cell, 24, 24);
        }
      });

      cell.addEventListener('dragend', () => {
        dragAllowed = false;
        cell.classList.remove('dragging');
        grid.querySelectorAll('.cell.drag-over').forEach((el) => el.classList.remove('drag-over'));
        schedulePersistSessionOrder();
      });

      cell.addEventListener('dragover', (e) => {
        e.preventDefault();
        e.dataTransfer.dropEffect = 'move';
        const dragging = grid.querySelector('.cell.dragging');
        if (!dragging || dragging === cell) return;

        cell.classList.add('drag-over');
        const insertBefore = shouldInsertBefore(dragging, cell, e.clientX, e.clientY);
        if (insertBefore) {
          if (dragging.nextSibling !== cell) {
            grid.insertBefore(dragging, cell);
          }
        } else if (dragging !== cell.nextSibling) {
          grid.insertBefore(dragging, cell.nextSibling);
        }
      });

      cell.addEventListener('dragleave', () => {
        cell.classList.remove('drag-over');
      });

      cell.addEventListener('drop', (e) => {
        e.preventDefault();
        cell.classList.remove('drag-over');
      });

      cell.draggable = true;
    }

    const OVERLAY_BAR_HEIGHT = 49;
    const DEFAULT_CELL_WIDTH = 320;
    const DEFAULT_CELL_HEIGHT = 240;
    const MIN_CELL_WIDTH = 260;
    const MIN_CELL_HEIGHT = 160;
    const MAX_CELL_WIDTH = 960;
    const MAX_CELL_HEIGHT = 720;

    function clampCellSize(value, min, max, fallback) {
      const n = parseInt(value, 10);
      if (!Number.isFinite(n)) return fallback;
      return Math.max(min, Math.min(max, n));
    }

    function applyCellSize(cell, session, width, height) {
      session.width = clampCellSize(width, MIN_CELL_WIDTH, MAX_CELL_WIDTH, DEFAULT_CELL_WIDTH);
      session.height = clampCellSize(height, MIN_CELL_HEIGHT, MAX_CELL_HEIGHT, DEFAULT_CELL_HEIGHT);
      cell.style.width = `${session.width}px`;
      cell.style.height = `${session.height}px`;
    }

    let sizeSaveTimer = null;

    async function persistSessionSize(session) {
      try {
        const res = await fetch(`/api/sessions/${session.id}`, {
          ...fetchOpts,
          method: 'PATCH',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ width: session.width, height: session.height }),
        });
        if (!res.ok) {
          const data = await res.json().catch(() => ({}));
          showToast(data.error || '保存窗口大小失败');
        }
      } catch (err) {
        showToast('保存窗口大小失败: ' + err.message);
      }
    }

    function schedulePersistSessionSize(session) {
      clearTimeout(sizeSaveTimer);
      sizeSaveTimer = setTimeout(() => persistSessionSize(session), 300);
    }

    function attachCellResize(cell, session) {
      const handle = document.createElement('div');
      handle.className = 'cell-resize-handle';
      handle.title = '拖动调整窗口大小';
      handle.setAttribute('aria-label', '拖动调整窗口大小');
      cell.appendChild(handle);

      let startX = 0;
      let startY = 0;
      let startW = 0;
      let startH = 0;

      handle.addEventListener('pointerdown', (e) => {
        if (isMobile || cell.classList.contains('expanded')) return;
        e.preventDefault();
        e.stopPropagation();
        startX = e.clientX;
        startY = e.clientY;
        startW = cell.offsetWidth;
        startH = cell.offsetHeight;
        cell.classList.add('resizing');
        handle.setPointerCapture(e.pointerId);

        const onMove = (ev) => {
          const width = startW + (ev.clientX - startX);
          const height = startH + (ev.clientY - startY);
          applyCellSize(cell, session, width, height);
          if (!cell.classList.contains('minimized') || cell.classList.contains('minimized-active')) {
            fitFrameToGrid(cell);
          }
        };

        const onUp = (ev) => {
          if (handle.hasPointerCapture(ev.pointerId)) {
            handle.releasePointerCapture(ev.pointerId);
          }
          cell.classList.remove('resizing');
          handle.removeEventListener('pointermove', onMove);
          handle.removeEventListener('pointerup', onUp);
          handle.removeEventListener('pointercancel', onUp);
          schedulePersistSessionSize(session);
          if (cell.classList.contains('minimized-active')) {
            requestAnimationFrame(() => fitFrameToGrid(cell));
          }
        };

        handle.addEventListener('pointermove', onMove);
        handle.addEventListener('pointerup', onUp);
        handle.addEventListener('pointercancel', onUp);
      });
    }

    function syncPlaceholderSize(placeholder, cell) {
      placeholder.style.width = `${cell.offsetWidth}px`;
      placeholder.style.height = `${cell.offsetHeight}px`;
    }

    function getExpandedTerminalSize() {
      return {
        width: window.innerWidth,
        height: Math.max(200, window.innerHeight - OVERLAY_BAR_HEIGHT),
      };
    }

    function ensureTerminalFrame(cell) {
      let viewport = cell.querySelector('.terminal-viewport');
      if (viewport) {
        return {
          viewport,
          frame: viewport.querySelector('.terminal-frame'),
          iframe: viewport.querySelector('iframe'),
        };
      }

      const iframe = cell.querySelector('iframe');
      viewport = document.createElement('div');
      viewport.className = 'terminal-viewport';
      const frame = document.createElement('div');
      frame.className = 'terminal-frame';
      if (iframe) {
        frame.appendChild(iframe);
      } else {
        const created = document.createElement('iframe');
        frame.appendChild(created);
      }
      viewport.appendChild(frame);
      cell.appendChild(viewport);
      return {
        viewport,
        frame,
        iframe: frame.querySelector('iframe'),
      };
    }

    function rememberExpandedSize(frame, width, height) {
      frame.dataset.expandedWidth = String(width);
      frame.dataset.expandedHeight = String(height);
    }

    function setFrameSize(frame, width, height) {
      frame.style.width = `${width}px`;
      frame.style.height = `${height}px`;
    }

    function fitFrameToGrid(cell) {
      const { viewport, frame } = ensureTerminalFrame(cell);
      const width = Math.max(1, viewport.clientWidth);
      const height = Math.max(1, viewport.clientHeight);
      setFrameSize(frame, width, height);
      frame.style.transform = 'none';
    }

    function expandTerminalFrame(cell) {
      const { frame, viewport } = ensureTerminalFrame(cell);
      let width;
      let height;
      if (cell.classList.contains('expanded')) {
        width = Math.max(1, viewport.clientWidth);
        height = Math.max(1, viewport.clientHeight);
      } else {
        const size = getExpandedTerminalSize();
        width = size.width;
        height = size.height;
      }
      setFrameSize(frame, width, height);
      rememberExpandedSize(frame, width, height);
      frame.style.transform = 'none';
      cell.classList.remove('minimized');
    }

    function repaintMinimizedTerminal(cell) {
      bumpRecency(cell.dataset.id);
      fitFrameToGrid(cell);
      cell.classList.add('minimized-active');
      requestAnimationFrame(() => {
        fitFrameToGrid(cell);
        const { iframe } = ensureTerminalFrame(cell);
        iframe.focus();
      });
    }

    function minimizeSession(view = activeView) {
      if (!view) return;

      const { cell, placeholder, session } = view;
      cell.classList.remove('expanded');
      cell.classList.remove('minimized-active');
      placeholder?.remove();
      activeView = null;
      overlay.classList.remove('active');
      document.body.classList.remove('session-expanded');

      requestAnimationFrame(() => {
        applyCellSize(cell, session, session.width, session.height);
        fitFrameToGrid(cell);
        cell.classList.add('minimized');
      });
    }

    function openSession(session, cell) {
      if (isMobile) {
        enterMobilePager(cell);
        return;
      }
      bumpRecency(session.id);
      if (activeView?.cell === cell) return;

      if (activeView) {
        minimizeSession(activeView);
      }

      cell.classList.remove('minimized');
      cell.classList.remove('minimized-active');

      const placeholder = document.createElement('div');
      placeholder.className = 'cell-placeholder';
      placeholder.setAttribute('aria-hidden', 'true');
      syncPlaceholderSize(placeholder, cell);
      cell.parentNode.insertBefore(placeholder, cell);

      activeView = { session, cell, placeholder };

      overlayTitle.value = session.title || session.defaultTitle || 'session';
      updateOverlayRecencyTag();
      overlay.classList.add('active');
      document.body.classList.add('session-expanded');
      cell.style.width = '';
      cell.style.height = '';
      cell.classList.add('expanded');

      requestAnimationFrame(() => {
        expandTerminalFrame(cell);
        requestAnimationFrame(() => expandTerminalFrame(cell));
      });
    }

    function closeOverlay() {
      minimizeSession();
    }

    function createCell(session, index) {
      normalizeSession(session, index);
      const label = session.title;

      const cell = document.createElement('div');
      cell.className = 'cell';
      cell.dataset.id = session.id;
      applyCellSize(cell, session, session.width, session.height);

      const header = document.createElement('div');
      header.className = 'cell-header';

      const recencyTagEl = document.createElement('span');
      recencyTagEl.className = 'cell-recency-tag';
      recencyTagEl.setAttribute('aria-label', '操作序号');
      header.appendChild(recencyTagEl);

      const titleEl = document.createElement('div');
      titleEl.className = 'cell-title-display';
      titleEl.contentEditable = 'true';
      titleEl.spellcheck = false;
      titleEl.textContent = label;
      titleEl.dataset.default = session.defaultTitle;
      titleEl.title = '点击编辑备注';
      attachTitleEditor(session, titleEl);
      header.appendChild(titleEl);

      const tmuxEl = document.createElement('span');
      tmuxEl.className = 'tmux-id';
      tmuxEl.textContent = session.tmuxSession || `agent-${session.id}`;
      tmuxEl.title = 'tmux session 名称（tmux attach -t ...）';

      const actions = document.createElement('div');
      actions.className = 'cell-actions';

      const dragBtn = document.createElement('button');
      dragBtn.className = 'btn-icon btn-drag';
      dragBtn.title = '拖动排序';
      dragBtn.textContent = '⠿';
      dragBtn.setAttribute('aria-label', '拖动排序');

      const maxBtn = document.createElement('button');
      maxBtn.className = 'btn-icon btn-maximize';
      maxBtn.title = '放大';
      maxBtn.textContent = '⤢';
      maxBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        openSession(session, cell);
      });

      const closeBtn = document.createElement('button');
      closeBtn.className = 'btn-icon btn-close';
      closeBtn.title = '关闭 session';
      closeBtn.textContent = '×';
      closeBtn.addEventListener('click', async (e) => {
        e.stopPropagation();
        const name = session.title || session.defaultTitle || session.id;
        if (!confirm(`确定关闭 session「${name}」吗？\n终端工作区将被删除。`)) return;
        if (activeView && activeView.session.id === session.id) minimizeSession();
        if (isMobile && document.body.classList.contains('mobile-pager')) {
          const cells = gridCells();
          const idx = cells.indexOf(cell);
          if (idx >= 0 && idx <= mobilePagerIndex && mobilePagerIndex > 0) {
            mobilePagerIndex -= 1;
          }
        }
        await fetch(`/api/sessions/${session.id}`, { ...fetchOpts, method: 'DELETE' });
        cell.remove();
        removeRecency(session.id);
        updateEmptyState();
        if (isMobile && document.body.classList.contains('mobile-pager')) {
          const remaining = gridCells();
          if (!remaining.length) {
            exitMobilePager();
          } else {
            renderMobilePagerDots();
            setMobilePagerIndex(Math.min(mobilePagerIndex, remaining.length - 1), false);
          }
        }
      });

      actions.appendChild(dragBtn);
      actions.appendChild(maxBtn);
      actions.appendChild(closeBtn);
      header.appendChild(tmuxEl);
      header.addEventListener('click', (e) => e.stopPropagation());
      header.addEventListener('dblclick', (e) => e.stopPropagation());
      header.appendChild(actions);

      const viewport = document.createElement('div');
      viewport.className = 'terminal-viewport';
      viewport.addEventListener('mousedown', () => bumpRecency(session.id));
      const frame = document.createElement('div');
      frame.className = 'terminal-frame';
      const iframe = document.createElement('iframe');
      initTerminalIframe(iframe, session.url);
      iframe.setAttribute('allow', 'clipboard-read; clipboard-write');
      frame.appendChild(iframe);
      viewport.appendChild(frame);

      const activator = document.createElement('button');
      activator.type = 'button';
      activator.className = 'terminal-activator';
      activator.textContent = '点击重绘以编辑';
      activator.title = '在小窗口重绘终端（不放大）';
      activator.addEventListener('mousedown', (e) => e.stopPropagation());
      activator.addEventListener('click', (e) => {
        e.preventDefault();
        e.stopPropagation();
        if (!cell.classList.contains('minimized')) return;
        if (isMobile) {
          enterMobilePager(cell);
          return;
        }
        repaintMinimizedTerminal(cell);
      });
      viewport.appendChild(activator);

      const overviewTap = document.createElement('button');
      overviewTap.type = 'button';
      overviewTap.className = 'overview-tap-catcher';
      overviewTap.setAttribute('aria-label', '打开全屏终端');
      overviewTap.addEventListener('click', (e) => {
        e.preventDefault();
        e.stopPropagation();
        if (isMobile) enterMobilePager(cell);
      });
      viewport.appendChild(overviewTap);

      cell.appendChild(header);
      cell.appendChild(viewport);

      attachDragReorder(cell);
      attachCellResize(cell, session);
      return cell;
    }

    function renderSessions(list) {
      if (activeView) minimizeSession();
      if (isMobile && document.body.classList.contains('mobile-pager')) {
        exitMobilePager();
      }
      grid.querySelectorAll('.cell').forEach((cell) => cell.remove());
      list.forEach((s, i) => grid.appendChild(createCell(s, i)));
      mergeRecencyAfterRender(list.map((s) => s.id));
      updateRecencyTags();
      updateEmptyState();
      if (isMobile) {
        requestAnimationFrame(refreshAllCellFrames);
      }
      setCellsDraggable(!isMobile);
    }

    async function loadSessions() {
      try {
        const res = await fetch('/api/sessions', fetchOpts);
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const sessions = await res.json();
        renderSessions(sessions);
      } catch (err) {
        console.error('loadSessions failed:', err);
        if (initialSessions.length && !grid.querySelector('.cell')) {
          renderSessions(initialSessions);
        }
        showToast('加载 session 失败，已使用缓存数据');
      }
    }

    async function resetAllLayouts() {
      if (activeView) {
        minimizeSession();
      }
      resetLayoutBtn.disabled = true;
      try {
        const res = await fetch('/api/sessions/reset-layout', { ...fetchOpts, method: 'POST' });
        if (!res.ok) {
          const data = await res.json().catch(() => ({}));
          showToast(data.error || '重置窗口失败');
          return;
        }
        const sessions = await res.json();
        renderSessions(sessions);
      } catch (err) {
        showToast('重置窗口失败: ' + err.message);
      } finally {
        resetLayoutBtn.disabled = false;
      }
    }

    overlayTitle.addEventListener('blur', () => {
      if (!activeView) return;
      const value = overlayTitle.value.trim();
      const current = (activeView.session.title || activeView.session.defaultTitle || '').trim();
      if (value === current) return;
      saveSessionTitle(activeView.session, value, null);
    });
    overlayTitle.addEventListener('keydown', (e) => {
      e.stopPropagation();
      if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) {
        e.preventDefault();
        overlayTitle.blur();
      }
    });
    overlayTitle.addEventListener('click', (e) => e.stopPropagation());
    overlayTitle.addEventListener('dblclick', (e) => e.stopPropagation());

    function closeCreateModal() {
      createModal.classList.remove('active');
      createConfirmBtn.disabled = false;
    }

    function renderTmuxOptions(available) {
      tmuxOptions.innerHTML = `
        <label class="tmux-option">
          <input type="radio" name="tmuxChoice" value="" checked>
          <span>新建 tmux session</span>
        </label>
      `;

      if (!available.length) {
        const empty = document.createElement('div');
        empty.className = 'tmux-empty';
        empty.textContent = '没有可复用的 tmux session';
        tmuxOptions.appendChild(empty);
        return;
      }

      for (const item of available) {
        const label = document.createElement('label');
        label.className = 'tmux-option';

        const input = document.createElement('input');
        input.type = 'radio';
        input.name = 'tmuxChoice';
        input.value = item.name;

        const nameSpan = document.createElement('span');
        nameSpan.textContent = item.name;

        const meta = document.createElement('span');
        meta.className = 'tmux-option-meta';
        const attached = item.attached ? '已 attach' : '未 attach';
        meta.textContent = `${item.windows} 窗 · ${attached}`;

        label.appendChild(input);
        label.appendChild(nameSpan);
        label.appendChild(meta);
        tmuxOptions.appendChild(label);
      }
    }

    async function openCreateModal() {
      createModal.classList.add('active');
      renderTmuxOptions([]);

      try {
        const res = await fetch('/api/tmux/sessions', fetchOpts);
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const data = await res.json();
        renderTmuxOptions(data.available || []);
      } catch (err) {
        console.error('load tmux sessions failed:', err);
        showToast('加载 tmux session 列表失败');
      }
    }

    function selectedTmuxChoice() {
      const checked = tmuxOptions.querySelector('input[name="tmuxChoice"]:checked');
      return checked ? checked.value.trim() : '';
    }

    async function createSession(tmuxSession) {
      createConfirmBtn.disabled = true;
      addBtn.disabled = true;
      try {
        const opts = { ...fetchOpts, method: 'POST' };
        if (tmuxSession) {
          opts.headers = { 'Content-Type': 'application/json' };
          opts.body = JSON.stringify({ tmuxSession });
        }
        const res = await fetch('/api/sessions', opts);
        const data = await res.json();
        if (!res.ok) {
          showToast(data.error || '创建 session 失败');
          return;
        }
        closeCreateModal();
        grid.appendChild(createCell(data, grid.querySelectorAll('.cell').length));
        updateEmptyState();
        if (isMobile) {
          requestAnimationFrame(refreshAllCellFrames);
          if (document.body.classList.contains('mobile-pager')) {
            renderMobilePagerDots();
            setMobilePagerIndex(gridCells().length - 1, false);
          }
        }
        setCellsDraggable(!isMobile);
      } catch (err) {
        showToast('网络错误: ' + err.message);
      } finally {
        createConfirmBtn.disabled = false;
        addBtn.disabled = false;
      }
    }

    createCancelBtn.addEventListener('click', closeCreateModal);
    createModal.addEventListener('click', (e) => {
      if (e.target === createModal) closeCreateModal();
    });
    createConfirmBtn.addEventListener('click', () => {
      createSession(selectedTmuxChoice());
    });

    document.addEventListener('keydown', (e) => {
      if (e.key !== 'Escape') return;
      if (settingsModal.classList.contains('active')) {
        cancelSettingsModal();
        return;
      }
      if (createModal.classList.contains('active')) {
        closeCreateModal();
      }
    });

    addBtn.addEventListener('click', () => {
      openCreateModal();
    });

    exitBtn.addEventListener('click', closeOverlay);
    resetLayoutBtn.addEventListener('click', resetAllLayouts);

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && overlay.classList.contains('active')) {
        closeOverlay();
      }
    });

    function setCellsDraggable(enabled) {
      gridCells().forEach((cell) => {
        cell.draggable = enabled;
      });
    }

    function onMobileGridScroll() {
      if (!document.body.classList.contains('mobile-pager')) return;
      const cells = gridCells();
      if (!cells.length) return;
      const gridRect = grid.getBoundingClientRect();
      const mid = gridRect.left + gridRect.width / 2;
      let bestIdx = 0;
      let bestDist = Infinity;
      cells.forEach((cell, i) => {
        const rect = cell.getBoundingClientRect();
        const cellMid = rect.left + rect.width / 2;
        const dist = Math.abs(cellMid - mid);
        if (dist < bestDist) {
          bestDist = dist;
          bestIdx = i;
        }
      });
      if (bestIdx !== mobilePagerIndex) {
        mobilePagerIndex = bestIdx;
        bumpRecency(cells[bestIdx].dataset.id);
        updateMobilePagerChrome();
        fitFrameToGrid(cells[bestIdx]);
      }
    }

    let gridScrollTimer = null;
    grid.addEventListener('scroll', () => {
      if (!document.body.classList.contains('mobile-pager')) return;
      clearTimeout(gridScrollTimer);
      gridScrollTimer = setTimeout(onMobileGridScroll, 120);
    }, { passive: true });

    mobileBackBtn.addEventListener('click', exitMobilePager);
    mobileOverviewBtn.addEventListener('click', exitMobilePager);
    mobilePrevBtn.addEventListener('click', () => goMobilePager(-1));
    mobileNextBtn.addEventListener('click', () => goMobilePager(1));
    settingsBtn.addEventListener('click', openSettingsModal);
    mobileSettingsBtn.addEventListener('click', openSettingsModal);
    settingsCloseBtn.addEventListener('click', confirmSettingsModal);
    settingsModal.addEventListener('click', (e) => {
      if (e.target === settingsModal) cancelSettingsModal();
    });
    settingsFontDown.addEventListener('click', () => changeDraftFontSize(-1));
    settingsFontUp.addEventListener('click', () => changeDraftFontSize(1));
    settingsFontSizeInput.addEventListener('keydown', (e) => {
      e.stopPropagation();
    });
    attachMobileSwipeNav(mobilePagerTop);
    attachMobileSwipeNav(mobilePagerBottom);

    // 点进终端 iframe 时父窗口会 blur，且 activeElement 变为该 iframe
    window.addEventListener('blur', () => {
      setTimeout(() => {
        const el = document.activeElement;
        if (el && el.tagName === 'IFRAME') {
          const cell = el.closest('.cell');
          if (cell) bumpRecency(cell.dataset.id);
        }
      }, 0);
    });

    mobileQuery.addEventListener('change', applyMobileMode);
    window.addEventListener('resize', () => {
      if (!isMobile) return;
      if (document.body.classList.contains('mobile-pager')) {
        setMobilePagerIndex(mobilePagerIndex, false);
      } else {
        refreshAllCellFrames();
      }
    });

    applyMobileMode();
    updateFontSizeControls(getTerminalFontSize());
    renderSessions(initialSessions);
    loadSessions();
  </script>
</body>
</html>
