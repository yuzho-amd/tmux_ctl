        backendTag.title = `后端: ${session.backendName || '本机'}`;
        header.appendChild(backendTag);
      }

      const tmuxEl = document.createElement('span');
      tmuxEl.className = 'tmux-id';
      tmuxEl.textContent = session.tmuxSession || `agent-${session.remoteId}`;
      tmuxEl.title = 'tmux session 名称（tmux attach -t ...）';

      const actions = document.createElement('div');
      actions.className = 'cell-actions';

      const dragBtn = document.createElement('button');
      dragBtn.className = 'btn-icon btn-drag';
      dragBtn.title = '拖动排序';
      dragBtn.textContent = '⠿';
      dragBtn.setAttribute('aria-label', '拖动排序');

      const maxBtn = document.createElement('button');
      maxBtn.className = 'btn-icon btn-maximize';
      maxBtn.title = '放大';
      maxBtn.textContent = '⤢';
      maxBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        openSession(session, cell);
      });

      const closeBtn = document.createElement('button');
      closeBtn.className = 'btn-icon btn-close';
      closeBtn.title = '关闭 session';
      closeBtn.textContent = '×';
      closeBtn.addEventListener('click', async (e) => {
        e.stopPropagation();
        const name = session.title || session.defaultTitle || session.id;
        if (!confirm(`确定关闭 session「${name}」吗？\n终端工作区将被删除。`)) return;
        if (activeView && activeView.session.id === session.id) minimizeSession();
        if (isMobile && document.body.classList.contains('mobile-pager')) {
          const cells = gridCells();
          const idx = cells.indexOf(cell);
          if (idx >= 0 && idx <= mobilePagerIndex && mobilePagerIndex > 0) {
            mobilePagerIndex -= 1;
          }
        }
        const backend = getBackendById(session.backendId);
        if (!backend) {
          showToast('后端不存在');
          return;
        }
        const delRes = await apiForBackend(backend, sessionApiPath(session), {
          method: 'DELETE',
        });
        if (!delRes.ok) {
          const data = await delRes.json().catch(() => ({}));
          showToast(data.error || '关闭 session 失败');
          return;
        }
        cell.remove();
        removeRecency(session.id);
        updateEmptyState();
        if (isMobile && document.body.classList.contains('mobile-pager')) {
          const remaining = gridCells();
          if (!remaining.length) {
            exitMobilePager();
          } else {
            renderMobilePagerDots();
            setMobilePagerIndex(Math.min(mobilePagerIndex, remaining.length - 1), false);
          }
        }
      });

      actions.appendChild(dragBtn);
      actions.appendChild(maxBtn);
      actions.appendChild(closeBtn);
      header.appendChild(tmuxEl);
      header.addEventListener('click', (e) => e.stopPropagation());
      header.addEventListener('dblclick', (e) => e.stopPropagation());
      header.appendChild(actions);

      const viewport = document.createElement('div');
      viewport.className = 'terminal-viewport';
      viewport.addEventListener('mousedown', () => bumpRecency(session.id));
      const frame = document.createElement('div');
      frame.className = 'terminal-frame';
      const iframe = document.createElement('iframe');
      initTerminalIframe(iframe, session.url);
      iframe.setAttribute('allow', 'clipboard-read; clipboard-write');
      frame.appendChild(iframe);
      viewport.appendChild(frame);

      const activator = document.createElement('button');
      activator.type = 'button';
      activator.className = 'terminal-activator';
      activator.textContent = '点击重绘以编辑';
      activator.title = '在小窗口重绘终端（不放大）';
      activator.addEventListener('mousedown', (e) => e.stopPropagation());
      activator.addEventListener('click', (e) => {
        e.preventDefault();
        e.stopPropagation();
        if (!cell.classList.contains('minimized')) return;
        if (isMobile) {
          enterMobilePager(cell);
          return;
        }
        repaintMinimizedTerminal(cell);
      });
      viewport.appendChild(activator);

      const overviewTap = document.createElement('button');
      overviewTap.type = 'button';
      overviewTap.className = 'overview-tap-catcher';
      overviewTap.setAttribute('aria-label', '打开全屏终端');
      overviewTap.addEventListener('click', (e) => {
        e.preventDefault();
        e.stopPropagation();
        if (isMobile) enterMobilePager(cell);
      });
      viewport.appendChild(overviewTap);

      cell.appendChild(header);
      cell.appendChild(viewport);

      attachDragReorder(cell);
      attachCellResize(cell, session);
      return cell;
    }

    function renderSessions(list) {
      if (activeView) minimizeSession();
      if (isMobile && document.body.classList.contains('mobile-pager')) {
        exitMobilePager();
      }
      grid.querySelectorAll('.cell').forEach((cell) => cell.remove());
      list.forEach((s, i) => grid.appendChild(createCell(s, i)));
      mergeRecencyAfterRender(list.map((s) => s.id));
      updateRecencyTags();
      updateEmptyState();
      if (isMobile) {
        requestAnimationFrame(refreshAllCellFrames);
      }
      setCellsDraggable(!isMobile);
    }

      try {
        await loadAllSessions();
      } catch (err) {
        console.error('loadSessions failed:', err);
        const fallback = filterSessionsByVisibleBackends(initialSessions.map(normalizeLocalSession));
        if (fallback.length && !grid.querySelector('.cell')) {

    async function resetAllLayouts() {
      if (activeView) {
        minimizeSession();

      try {
        const localRes = await fetch('/api/sessions/reset-layout', { ...fetchOpts, method: 'POST' });
        if (!localRes.ok) {
          const data = await localRes.json().catch(() => ({}));
          showToast(data.error || '重置本机窗口失败');
          return;
        }
        const remoteResults = await Promise.allSettled(
          remoteBackends.map((backend) =>
            apiForBackend(backend, '/api/sessions/reset-layout', { method: 'POST' })
          )
        );
        const failed = remoteResults
          .map((result, index) => (result.status === 'rejected' || !result.value?.ok ? remoteBackends[index].name : null))
          .filter(Boolean);
        saveFederatedLayout({ sizes: {} });
        await loadAllSessions();
        if (failed.length) {
          showToast(`部分远程重置失败: ${failed.join(', ')}`);

        showToast('重置窗口失败: ' + err.message);
      } finally {
        resetLayoutBtn.disabled = false;
      }
    }

    overlayTitle.addEventListener('blur', () => {

    overlayTitle.addEventListener('click', (e) => e.stopPropagation());
    overlayTitle.addEventListener('dblclick', (e) => e.stopPropagation());

    function closeCreateModal() {

    function renderTmuxOptions(available) {

    async function loadTmuxOptionsForBackend(backendId) {
      renderTmuxOptions([]);
      const backend = getBackendById(backendId);
      if (!backend) return;
      try {
        const res = await apiForBackend(backend, '/api/tmux/sessions');
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const data = await res.json();
        renderTmuxOptions(data.available || []);
      } catch (err) {
        console.error('load tmux sessions failed:', err);
        showToast(`加载 ${backend.name} 的 tmux 列表失败`);
      }

    async function createSession(tmuxSession, backendId) {
      createConfirmBtn.disabled = true;
      addBtn.disabled = true;
      const backend = getBackendById(backendId || createBackendSelect.value || LOCAL_BACKEND_ID);
      if (!backend) {
        showToast('请选择有效后端');
        createConfirmBtn.disabled = false;
        addBtn.disabled = false;
        return;
      }
      try {
        const body = tmuxSession ? { tmuxSession } : undefined;
        const res = await apiForBackend(backend, '/api/sessions', {
          method: 'POST',
          body,
        });
        const data = await res.json();
        if (!res.ok) {
          showToast(data.error || '创建 session 失败');
          return;
        }
        const session = backend.isLocal
          ? normalizeLocalSession(data)
          : normalizeRemoteSession(data, backend);
        closeCreateModal();
        grid.appendChild(createCell(session, grid.querySelectorAll('.cell').length));
        if (hasRemoteBackends()) {
          saveFederatedLayout({ order: gridSessionOrder() });
        }
        schedulePersistSessionOrder();
        updateEmptyState();
        if (isMobile) {
          requestAnimationFrame(refreshAllCellFrames);
          if (document.body.classList.contains('mobile-pager')) {
            renderMobilePagerDots();
            setMobilePagerIndex(gridCells().length - 1, false);
          }
        }
        setCellsDraggable(!isMobile);
      } catch (err) {
        showToast('网络错误: ' + err.message);
      } finally {
        createConfirmBtn.disabled = false;
        addBtn.disabled = false;
      }
    }

      if (!backend) return;

        if (editingBackendId === backendId) {
          resetBackendAddForm();
        }
        draftRemoteBackends = draftRemoteBackends.filter((item) => item.id !== backendId);

        return;

        startEditBackend(backend);

          showToast(`${backend.name} 连接成功（${count} 个 session）`);

    backendAddBtn.addEventListener('click', async () => {
      const draft = readBackendDraftFromForm();
      if (!draft.baseUrl) {
        showToast('请填写后端地址');
        return;
      }
      ensureDraftRemoteBackends();

        const index = draftRemoteBackends.findIndex((item) => item.id === editingBackendId);

    function setCellsDraggable(enabled) {

    function onMobileGridScroll() {
      if (!document.body.classList.contains('mobile-pager')) return;
      const cells = gridCells();
      if (!cells.length) return;
      const gridRect = grid.getBoundingClientRect();
      const mid = gridRect.left + gridRect.width / 2;
      let bestIdx = 0;
      let bestDist = Infinity;
      cells.forEach((cell, i) => {
        const rect = cell.getBoundingClientRect();
        const cellMid = rect.left + rect.width / 2;
        const dist = Math.abs(cellMid - mid);
        if (dist < bestDist) {
          bestDist = dist;
          bestIdx = i;
        }
      });
      if (bestIdx !== mobilePagerIndex) {
        mobilePagerIndex = bestIdx;
        bumpRecency(cells[bestIdx].dataset.id);
        updateMobilePagerChrome();
        fitFrameToGrid(cells[bestIdx]);
      }
    }

    let gridScrollTimer = null;
    grid.addEventListener('scroll', () => {
      if (!document.body.classList.contains('mobile-pager')) return;
      clearTimeout(gridScrollTimer);
      gridScrollTimer = setTimeout(onMobileGridScroll, 120);
    }, { passive: true });

    window.addEventListener('blur', () => {
      setTimeout(() => {
        const el = document.activeElement;
        if (el && el.tagName === 'IFRAME') {
          const cell = el.closest('.cell');
          if (cell) bumpRecency(cell.dataset.id);
        }
      }, 0);
    });

    mobileQuery.addEventListener('change', applyMobileMode);
    window.addEventListener('resize', () => {
      if (!isMobile) return;
      if (document.body.classList.contains('mobile-pager')) {
        setMobilePagerIndex(mobilePagerIndex, false);
      } else {
        refreshAllCellFrames();
      }
    });

    applyMobileMode();
    updateFontSizeControls(getTerminalFontSize());
    (async () => {
      await initBackends();
      renderSessions(filterSessionsByVisibleBackends(initialSessions.map(normalizeLocalSession)));
      loadSessions();
    })();
  </script>
</body>
</html>
