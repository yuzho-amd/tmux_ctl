<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>Agent Control</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body, #grid, #overlay {
      scrollbar-width: thin;
      scrollbar-color: #1a1a1a #000;
    }

    html::-webkit-scrollbar,
    body::-webkit-scrollbar,
    #grid::-webkit-scrollbar,
    #overlay::-webkit-scrollbar {
      width: 4px;
      height: 4px;
    }

    html::-webkit-scrollbar-track,
    body::-webkit-scrollbar-track,
    #grid::-webkit-scrollbar-track,
    #overlay::-webkit-scrollbar-track {
      background: #000;
    }

    html::-webkit-scrollbar-thumb,
    body::-webkit-scrollbar-thumb,
    #grid::-webkit-scrollbar-thumb,
    #overlay::-webkit-scrollbar-thumb {
      background: #1a1a1a;
      border-radius: 2px;
    }

    html::-webkit-scrollbar-thumb:hover,
    body::-webkit-scrollbar-thumb:hover,
    #grid::-webkit-scrollbar-thumb:hover,
    #overlay::-webkit-scrollbar-thumb:hover {
      background: #333;
    }

    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #0f1117;
      color: #e6edf3;
      min-height: 100vh;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 20px;
      border-bottom: 1px solid #21262d;
      background: #161b22;
    }

    header h1 {
      font-size: 16px;
      font-weight: 600;
    }

    .hint {
      font-size: 12px;
      color: #8b949e;
    }

    #grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 12px;
      padding: 16px;
      min-height: calc(100vh - 52px);
      align-content: start;
    }

    #grid.empty {
      place-items: center;
      align-content: center;
    }

    .cell {
      position: relative;
      display: flex;
      flex-direction: column;
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 8px;
      overflow: hidden;
      aspect-ratio: 4 / 3;
      cursor: default;
      transition: border-color 0.15s, box-shadow 0.15s;
    }

    .cell:hover {
      border-color: #58a6ff;
      box-shadow: 0 0 0 1px #58a6ff33;
    }

    .cell-header {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      padding: 6px 10px;
      background: #21262d;
      font-size: 12px;
      color: #8b949e;
      flex-shrink: 0;
      position: relative;
      z-index: 2;
      pointer-events: auto;
    }

    .cell-title-box {
      flex: 1;
      min-width: 0;
    }

    .cell-title-display {
      display: block;
      flex: 1;
      min-width: 0;
      color: #e6edf3 !important;
      font-size: 12px;
      line-height: 1.4;
      padding: 2px 6px;
      cursor: text;
      white-space: pre-wrap;
      word-break: break-word;
      overflow-wrap: anywhere;
      min-height: 22px;
      outline: none;
    }

    .cell-title-display:empty::before {
      content: attr(data-default);
      color: #8b949e;
    }

    .cell-title-display:hover {
      background: #0f111733;
      border-radius: 3px;
    }

    .cell-title-display:focus {
      background: #0f1117;
      box-shadow: 0 0 0 1px #58a6ff;
      border-radius: 3px;
    }

    .tmux-id {
      flex-shrink: 0;
      align-self: flex-start;
      margin-top: 3px;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 10px;
      color: #6e7681;
      background: #0f1117;
      border: 1px solid #30363d;
      border-radius: 3px;
      padding: 1px 5px;
      cursor: default;
      user-select: all;
    }

    .overlay-title {
      flex: 1;
      min-width: 0;
      background: #0f1117;
      border: 1px solid #30363d;
      color: #e6edf3;
      font-size: 14px;
      line-height: 1.4;
      outline: none;
      padding: 4px 8px;
      resize: none;
      white-space: pre-wrap;
      word-break: break-word;
      overflow-wrap: anywhere;
      cursor: text;
      width: 100%;
      min-height: 28px;
      border-radius: 3px;
      box-sizing: border-box;
    }

    .cell-actions {
      display: flex;
      align-items: flex-start;
      gap: 2px;
      flex-shrink: 0;
    }

    .btn-icon {
      flex-shrink: 0;
      align-self: flex-start;
      margin-top: 1px;
      background: none;
      border: none;
      color: #8b949e;
      cursor: pointer;
      font-size: 14px;
      line-height: 1;
      padding: 0 4px;
    }

    .btn-icon:hover { color: #e6edf3; }

    .btn-maximize:hover { color: #58a6ff; }

    .btn-drag {
      font-size: 12px;
      letter-spacing: -1px;
      cursor: grab;
      touch-action: none;
    }

    .btn-drag:hover { color: #d2a8ff; }

    .btn-drag:active { cursor: grabbing; }

    .cell.dragging {
      opacity: 0.55;
      border-color: #d2a8ff;
      box-shadow: 0 0 0 1px #d2a8ff55;
    }

    .cell.drag-over {
      border-color: #d2a8ff;
      box-shadow: 0 0 0 2px #d2a8ff66;
    }

    .btn-close {
      font-size: 16px;
    }

    .btn-close:hover { color: #f85149; }

    .terminal-viewport {
      flex: 1;
      min-height: 0;
      overflow: hidden;
      position: relative;
      background: #000;
    }

    .terminal-frame {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      transform-origin: top left;
    }

    .terminal-frame iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
      background: #000;
      pointer-events: auto;
    }

    .cell.minimized .terminal-frame iframe {
      pointer-events: none;
    }

    .cell.minimized-active .terminal-frame iframe {
      pointer-events: auto;
    }

    .terminal-activator {
      display: none;
      position: absolute;
      inset: 0;
      z-index: 4;
      border: none;
      padding: 0;
      background: rgba(0, 0, 0, 0.5);
      color: #8b949e;
      font-size: 12px;
      cursor: pointer;
    }

    .cell.minimized:not(.minimized-active) .terminal-activator {
      display: block;
    }

    body.session-expanded {
      overflow: hidden;
    }

    .cell-placeholder {
      aspect-ratio: 4 / 3;
      visibility: hidden;
      pointer-events: none;
    }

    .cell.expanded {
      position: fixed;
      top: var(--overlay-bar-height, 49px);
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 90;
      aspect-ratio: unset;
      height: auto;
      border-radius: 0;
      border: none;
      cursor: default;
    }

    .cell.expanded:hover {
      border-color: transparent;
      box-shadow: none;
    }

    .cell.expanded .cell-header {
      display: none;
    }

    .cell.expanded .terminal-viewport {
      flex: 1;
    }

    .cell.expanded .terminal-frame {
      position: absolute;
      top: 0;
      left: 0;
    }

    .cell.expanded .terminal-frame iframe {
      pointer-events: auto;
    }

    .fab {
      position: fixed;
      right: 24px;
      bottom: 24px;
      width: 56px;
      height: 56px;
      border-radius: 50%;
      border: none;
      background: #238636;
      color: #fff;
      font-size: 32px;
      line-height: 1;
      cursor: pointer;
      box-shadow: 0 4px 16px #0008;
      transition: transform 0.15s, background 0.15s;
      z-index: 10;
    }

    .fab:hover {
      background: #2ea043;
      transform: scale(1.05);
    }

    .fab:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }

    /* fullscreen overlay — bar only; iframe stays in its cell */
    #overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 100;
      pointer-events: none;
    }

    #overlay.active { display: block; }

    .overlay-bar {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      padding: 10px 16px;
      background: #161b22;
      border-bottom: 1px solid #21262d;
      pointer-events: auto;
    }

    .overlay-bar span {
      display: none;
    }

    .overlay-actions { display: flex; gap: 8px; }

    .overlay-actions button {
      background: #21262d;
      border: 1px solid #30363d;
      color: #e6edf3;
      padding: 6px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 13px;
    }

    .overlay-actions button:hover { background: #30363d; }

    .overlay-body { display: none; }

    .empty-msg {
      text-align: center;
      color: #8b949e;
    }

    .empty-msg p { margin-top: 8px; font-size: 14px; }

    .toast {
      position: fixed;
      bottom: 90px;
      right: 24px;
      background: #da3633;
      color: #fff;
      padding: 10px 16px;
      border-radius: 6px;
      font-size: 13px;
      display: none;
      z-index: 200;
      max-width: 360px;
    }

    .toast.show { display: block; }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.55);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 150;
      padding: 24px;
    }

    .modal-backdrop.active { display: flex; }

    .modal {
      width: min(420px, 100%);
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 10px;
      box-shadow: 0 16px 48px rgba(0, 0, 0, 0.45);
      overflow: hidden;
    }

    .modal-header {
      padding: 16px 18px 8px;
      font-size: 16px;
      font-weight: 600;
      color: #e6edf3;
    }

    .modal-body {
      padding: 8px 18px 16px;
      color: #8b949e;
      font-size: 13px;
    }

    .tmux-options {
      margin-top: 12px;
      max-height: 220px;
      overflow-y: auto;
      border: 1px solid #21262d;
      border-radius: 8px;
      background: #0d1117;
    }

    .tmux-option {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 12px;
      border-bottom: 1px solid #21262d;
      cursor: pointer;
      color: #e6edf3;
    }

    .tmux-option:last-child { border-bottom: none; }

    .tmux-option:hover { background: #161b22; }

    .tmux-option input { accent-color: #238636; }

    .tmux-option-meta {
      margin-left: auto;
      font-size: 11px;
      color: #8b949e;
    }

    .tmux-empty {
      padding: 14px 12px;
      color: #8b949e;
      font-size: 13px;
    }

    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      padding: 12px 18px 16px;
      border-top: 1px solid #21262d;
    }

    .modal-actions button {
      background: #21262d;
      border: 1px solid #30363d;
      color: #e6edf3;
      padding: 8px 14px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 13px;
    }

    .modal-actions button:hover { background: #30363d; }

    .modal-actions button.primary {
      background: #238636;
      border-color: #238636;
      color: #fff;
    }

    .modal-actions button.primary:hover { background: #2ea043; }

    .modal-actions button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }
  </style>
</head>
<body>
  <header>
    <h1>Agent Control</h1>
    <span class="hint">点击标题编辑 · 拖动 ⠿ 调整顺序 · 最小化后点击终端重绘 · 仅 ⤢ 放大</span>
  </header>

  <div id="grid" class="empty">
    <div class="empty-msg">
      <div style="font-size:48px;opacity:0.3">+</div>
      <p>点击右下角加号创建终端 session</p>
    </div>
  </div>

  <button class="fab" id="addBtn" title="新建 session">+</button>

  <div id="overlay">
    <div class="overlay-bar">
      <textarea id="overlayTitle" class="overlay-title" rows="1" placeholder="点击输入备注..."></textarea>
      <div class="overlay-actions">
        <button id="exitBtn">最小化 (Esc)</button>
      </div>
    </div>
    <div class="overlay-body"></div>
  </div>

  <div class="toast" id="toast"></div>

  <div class="modal-backdrop" id="createModal">
    <div class="modal" role="dialog" aria-labelledby="createModalTitle">
      <div class="modal-header" id="createModalTitle">新建 session</div>
      <div class="modal-body">
        <p>选择复用已有 tmux session，或新建一个。</p>
        <div class="tmux-options" id="tmuxOptions">
          <label class="tmux-option">
            <input type="radio" name="tmuxChoice" value="" checked>
            <span>新建 tmux session</span>
          </label>
        </div>
      </div>
      <div class="modal-actions">
        <button type="button" id="createCancelBtn">取消</button>
        <button type="button" class="primary" id="createConfirmBtn">创建</button>
      </div>
    </div>
  </div>

  <script>
    const initialSessions = {{ initial_sessions | tojson }};
    const fetchOpts = { cache: 'no-store' };
    const grid = document.getElementById('grid');
    const addBtn = document.getElementById('addBtn');
    const overlay = document.getElementById('overlay');
    const overlayTitle = document.getElementById('overlayTitle');
    const exitBtn = document.getElementById('exitBtn');
    const toast = document.getElementById('toast');
    const createModal = document.getElementById('createModal');
    const tmuxOptions = document.getElementById('tmuxOptions');
    const createCancelBtn = document.getElementById('createCancelBtn');
    const createConfirmBtn = document.getElementById('createConfirmBtn');

    let activeView = null;

    function showToast(msg) {
      toast.textContent = msg;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 4000);
    }

    function updateEmptyState() {
      const cells = grid.querySelectorAll('.cell');
      const emptyMsg = grid.querySelector('.empty-msg');
      if (cells.length === 0) {
        grid.classList.add('empty');
        if (!emptyMsg) {
          const div = document.createElement('div');
          div.className = 'empty-msg';
          div.innerHTML = '<div style="font-size:48px;opacity:0.3">+</div><p>点击右下角加号创建终端 session</p>';
          grid.appendChild(div);
        }
      } else {
        grid.classList.remove('empty');
        if (emptyMsg) emptyMsg.remove();
      }
    }

    function defaultLabel(session, index) {
      const title = (session.title || '').trim();
      const fallback = (session.defaultTitle || '').trim() || `session-${index + 1}`;
      return title || fallback;
    }

    function normalizeSession(session, index) {
      const fallback = (session.defaultTitle || '').trim() || `session-${index + 1}`;
      session.defaultTitle = fallback;
      session.title = (session.title || '').trim() || fallback;
      return session;
    }

    async function saveSessionTitle(session, rawTitle, sourceEl) {
      const fallback = session.defaultTitle || 'session-1';
      const value = (rawTitle || '').trim() || fallback;
      if (sourceEl) sourceEl.textContent = value;
      session.title = value;

      const res = await fetch(`/api/sessions/${session.id}`, {
        ...fetchOpts,
        method: 'PATCH',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ title: value }),
      });
      if (!res.ok) {
        showToast('保存备注失败');
        return false;
      }

      const data = await res.json();
      session.title = data.title || value;
      session.defaultTitle = data.defaultTitle || session.defaultTitle;

      const cell = grid.querySelector(`.cell[data-id="${session.id}"]`);
      const cellTitle = cell?.querySelector('.cell-title-display');
      if (cellTitle && cellTitle !== sourceEl) {
        cellTitle.textContent = session.title;
      }
      if (overlayTitle !== sourceEl && activeView?.session.id === session.id) {
        overlayTitle.value = session.title;
      }
      return true;
    }

    function attachTitleEditor(session, el) {
      el.addEventListener('blur', () => saveSessionTitle(session, el.textContent, el));
      el.addEventListener('keydown', (e) => {
        e.stopPropagation();
        if (e.key === 'Enter' && !e.shiftKey) {
          e.preventDefault();
          el.blur();
        }
      });
      el.addEventListener('click', (e) => e.stopPropagation());
      el.addEventListener('dblclick', (e) => e.stopPropagation());
    }

    function gridSessionOrder() {
      return [...grid.querySelectorAll('.cell')].map((cell) => cell.dataset.id);
    }

    let orderSaveTimer = null;

    async function persistSessionOrder() {
      const order = gridSessionOrder();
      if (!order.length) return;
      try {
        const res = await fetch('/api/sessions/order', {
          ...fetchOpts,
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ order }),
        });
        if (!res.ok) {
          const data = await res.json().catch(() => ({}));
          showToast(data.error || '保存排序失败');
        }
      } catch (err) {
        showToast('保存排序失败: ' + err.message);
      }
    }

    function schedulePersistSessionOrder() {
      clearTimeout(orderSaveTimer);
      orderSaveTimer = setTimeout(persistSessionOrder, 300);
    }

    function shouldInsertBefore(dragging, target, x, y) {
      const rect = target.getBoundingClientRect();
      const midX = rect.left + rect.width / 2;
      const midY = rect.top + rect.height / 2;
      const rowThreshold = rect.height * 0.25;
      if (y < midY - rowThreshold) return true;
      if (y > midY + rowThreshold) return false;
      return x < midX;
    }

    function attachDragReorder(cell) {
      const handle = cell.querySelector('.btn-drag');
      if (!handle) return;

      let dragAllowed = false;

      handle.addEventListener('pointerdown', (e) => {
        e.stopPropagation();
        dragAllowed = true;
        handle.setPointerCapture(e.pointerId);
      });

      handle.addEventListener('pointerup', (e) => {
        e.stopPropagation();
        dragAllowed = false;
        if (handle.hasPointerCapture(e.pointerId)) {
          handle.releasePointerCapture(e.pointerId);
        }
      });

      handle.addEventListener('click', (e) => e.stopPropagation());

      cell.addEventListener('dragstart', (e) => {
        if (!dragAllowed) {
          e.preventDefault();
          return;
        }
        e.dataTransfer.effectAllowed = 'move';
        e.dataTransfer.setData('text/plain', cell.dataset.id);
        cell.classList.add('dragging');
        if (e.dataTransfer.setDragImage) {
          e.dataTransfer.setDragImage(cell, 24, 24);
        }
      });

      cell.addEventListener('dragend', () => {
        dragAllowed = false;
        cell.classList.remove('dragging');
        grid.querySelectorAll('.cell.drag-over').forEach((el) => el.classList.remove('drag-over'));
        schedulePersistSessionOrder();
      });

      cell.addEventListener('dragover', (e) => {
        e.preventDefault();
        e.dataTransfer.dropEffect = 'move';
        const dragging = grid.querySelector('.cell.dragging');
        if (!dragging || dragging === cell) return;

        cell.classList.add('drag-over');
        const insertBefore = shouldInsertBefore(dragging, cell, e.clientX, e.clientY);
        if (insertBefore) {
          if (dragging.nextSibling !== cell) {
            grid.insertBefore(dragging, cell);
          }
        } else if (dragging !== cell.nextSibling) {
          grid.insertBefore(dragging, cell.nextSibling);
        }
      });

      cell.addEventListener('dragleave', () => {
        cell.classList.remove('drag-over');
      });

      cell.addEventListener('drop', (e) => {
        e.preventDefault();
        cell.classList.remove('drag-over');
      });

      cell.draggable = true;
    }

    const OVERLAY_BAR_HEIGHT = 49;

    function getExpandedTerminalSize() {
      return {
        width: window.innerWidth,
        height: Math.max(200, window.innerHeight - OVERLAY_BAR_HEIGHT),
      };
    }

    function ensureTerminalFrame(cell) {
      let viewport = cell.querySelector('.terminal-viewport');
      if (viewport) {
        return {
          viewport,
          frame: viewport.querySelector('.terminal-frame'),
          iframe: viewport.querySelector('iframe'),
        };
      }

      const iframe = cell.querySelector('iframe');
      viewport = document.createElement('div');
      viewport.className = 'terminal-viewport';
      const frame = document.createElement('div');
      frame.className = 'terminal-frame';
      if (iframe) {
        frame.appendChild(iframe);
      } else {
        const created = document.createElement('iframe');
        frame.appendChild(created);
      }
      viewport.appendChild(frame);
      cell.appendChild(viewport);
      return {
        viewport,
        frame,
        iframe: frame.querySelector('iframe'),
      };
    }

    function readExpandedSize(frame) {
      const width = parseInt(frame.dataset.expandedWidth || '', 10);
      const height = parseInt(frame.dataset.expandedHeight || '', 10);
      if (!width || !height) return null;
      return { width, height };
    }

    function rememberExpandedSize(frame, width, height) {
      frame.dataset.expandedWidth = String(width);
      frame.dataset.expandedHeight = String(height);
    }

    function setFrameSize(frame, width, height) {
      frame.style.width = `${width}px`;
      frame.style.height = `${height}px`;
    }

    function fitFrameToGrid(cell) {
      const { viewport, frame } = ensureTerminalFrame(cell);
      const width = Math.max(1, viewport.clientWidth);
      const height = Math.max(1, viewport.clientHeight);
      setFrameSize(frame, width, height);
      frame.style.transform = 'none';
    }

    function expandTerminalFrame(cell) {
      const { frame } = ensureTerminalFrame(cell);
      let size = readExpandedSize(frame);
      if (!size) {
        size = getExpandedTerminalSize();
        rememberExpandedSize(frame, size.width, size.height);
      }
      setFrameSize(frame, size.width, size.height);
      frame.style.transform = 'none';
      cell.classList.remove('minimized');
    }

    function repaintMinimizedTerminal(cell) {
      fitFrameToGrid(cell);
      cell.classList.add('minimized-active');
      requestAnimationFrame(() => {
        fitFrameToGrid(cell);
        const { iframe } = ensureTerminalFrame(cell);
        iframe.focus();
      });
    }

    function minimizeSession(view = activeView) {
      if (!view) return;

      const { cell, placeholder } = view;
      cell.classList.remove('expanded');
      cell.classList.remove('minimized-active');
      placeholder?.remove();
      activeView = null;
      overlay.classList.remove('active');
      document.body.classList.remove('session-expanded');

      requestAnimationFrame(() => {
        fitFrameToGrid(cell);
        cell.classList.add('minimized');
      });
    }

    function openSession(session, cell) {
      if (activeView?.cell === cell) return;

      if (activeView) {
        minimizeSession(activeView);
      }

      expandTerminalFrame(cell);
      cell.classList.remove('minimized');
      cell.classList.remove('minimized-active');

      const placeholder = document.createElement('div');
      placeholder.className = 'cell-placeholder';
      placeholder.setAttribute('aria-hidden', 'true');
      cell.parentNode.insertBefore(placeholder, cell);

      activeView = { session, cell, placeholder };

      overlayTitle.value = session.title || session.defaultTitle || 'session';
      overlay.classList.add('active');
      document.body.classList.add('session-expanded');
      cell.classList.add('expanded');
    }

    function closeOverlay() {
      minimizeSession();
    }

    function createCell(session, index) {
      normalizeSession(session, index);
      const label = session.title;

      const cell = document.createElement('div');
      cell.className = 'cell';
      cell.dataset.id = session.id;

      const header = document.createElement('div');
      header.className = 'cell-header';

      const titleEl = document.createElement('div');
      titleEl.className = 'cell-title-display';
      titleEl.contentEditable = 'true';
      titleEl.spellcheck = false;
      titleEl.textContent = label;
      titleEl.dataset.default = session.defaultTitle;
      titleEl.title = '点击编辑备注';
      attachTitleEditor(session, titleEl);
      header.appendChild(titleEl);

      const tmuxEl = document.createElement('span');
      tmuxEl.className = 'tmux-id';
      tmuxEl.textContent = session.tmuxSession || `agent-${session.id}`;
      tmuxEl.title = 'tmux session 名称（tmux attach -t ...）';

      const actions = document.createElement('div');
      actions.className = 'cell-actions';

      const dragBtn = document.createElement('button');
      dragBtn.className = 'btn-icon btn-drag';
      dragBtn.title = '拖动排序';
      dragBtn.textContent = '⠿';
      dragBtn.setAttribute('aria-label', '拖动排序');

      const maxBtn = document.createElement('button');
      maxBtn.className = 'btn-icon btn-maximize';
      maxBtn.title = '放大';
      maxBtn.textContent = '⤢';
      maxBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        openSession(session, cell);
      });

      const closeBtn = document.createElement('button');
      closeBtn.className = 'btn-icon btn-close';
      closeBtn.title = '关闭 session';
      closeBtn.textContent = '×';
      closeBtn.addEventListener('click', async (e) => {
        e.stopPropagation();
        const name = session.title || session.defaultTitle || session.id;
        if (!confirm(`确定关闭 session「${name}」吗？\n终端工作区将被删除。`)) return;
        if (activeView && activeView.session.id === session.id) minimizeSession();
        await fetch(`/api/sessions/${session.id}`, { ...fetchOpts, method: 'DELETE' });
        cell.remove();
        updateEmptyState();
      });

      actions.appendChild(dragBtn);
      actions.appendChild(maxBtn);
      actions.appendChild(closeBtn);
      header.appendChild(tmuxEl);
      header.addEventListener('click', (e) => e.stopPropagation());
      header.addEventListener('dblclick', (e) => e.stopPropagation());
      header.appendChild(actions);

      const viewport = document.createElement('div');
      viewport.className = 'terminal-viewport';
      const frame = document.createElement('div');
      frame.className = 'terminal-frame';
      const iframe = document.createElement('iframe');
      iframe.src = session.url;
      iframe.setAttribute('allow', 'clipboard-read; clipboard-write');
      frame.appendChild(iframe);
      viewport.appendChild(frame);

      const activator = document.createElement('button');
      activator.type = 'button';
      activator.className = 'terminal-activator';
      activator.textContent = '点击重绘以编辑';
      activator.title = '在小窗口重绘终端（不放大）';
      activator.addEventListener('mousedown', (e) => e.stopPropagation());
      activator.addEventListener('click', (e) => {
        e.preventDefault();
        e.stopPropagation();
        if (!cell.classList.contains('minimized')) return;
        repaintMinimizedTerminal(cell);
      });
      viewport.appendChild(activator);

      cell.appendChild(header);
      cell.appendChild(viewport);

      attachDragReorder(cell);
      return cell;
    }

    function renderSessions(list) {
      grid.querySelectorAll('.cell').forEach((cell) => cell.remove());
      list.forEach((s, i) => grid.appendChild(createCell(s, i)));
      updateEmptyState();
    }

    async function loadSessions() {
      try {
        const res = await fetch('/api/sessions', fetchOpts);
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const sessions = await res.json();
        renderSessions(sessions);
      } catch (err) {
        console.error('loadSessions failed:', err);
        if (initialSessions.length && !grid.querySelector('.cell')) {
          renderSessions(initialSessions);
        }
        showToast('加载 session 失败，已使用缓存数据');
      }
    }

    overlayTitle.addEventListener('blur', () => {
      if (!activeView) return;
      const value = overlayTitle.value.trim();
      const current = (activeView.session.title || activeView.session.defaultTitle || '').trim();
      if (value === current) return;
      saveSessionTitle(activeView.session, value, null);
    });
    overlayTitle.addEventListener('keydown', (e) => {
      e.stopPropagation();
      if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) {
        e.preventDefault();
        overlayTitle.blur();
      }
    });
    overlayTitle.addEventListener('click', (e) => e.stopPropagation());
    overlayTitle.addEventListener('dblclick', (e) => e.stopPropagation());

    function closeCreateModal() {
      createModal.classList.remove('active');
      createConfirmBtn.disabled = false;
    }

    function renderTmuxOptions(available) {
      tmuxOptions.innerHTML = `
        <label class="tmux-option">
          <input type="radio" name="tmuxChoice" value="" checked>
          <span>新建 tmux session</span>
        </label>
      `;

      if (!available.length) {
        const empty = document.createElement('div');
        empty.className = 'tmux-empty';
        empty.textContent = '没有可复用的 tmux session';
        tmuxOptions.appendChild(empty);
        return;
      }

      for (const item of available) {
        const label = document.createElement('label');
        label.className = 'tmux-option';

        const input = document.createElement('input');
        input.type = 'radio';
        input.name = 'tmuxChoice';
        input.value = item.name;

        const nameSpan = document.createElement('span');
        nameSpan.textContent = item.name;

        const meta = document.createElement('span');
        meta.className = 'tmux-option-meta';
        const attached = item.attached ? '已 attach' : '未 attach';
        meta.textContent = `${item.windows} 窗 · ${attached}`;

        label.appendChild(input);
        label.appendChild(nameSpan);
        label.appendChild(meta);
        tmuxOptions.appendChild(label);
      }
    }

    async function openCreateModal() {
      createModal.classList.add('active');
      renderTmuxOptions([]);

      try {
        const res = await fetch('/api/tmux/sessions', fetchOpts);
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const data = await res.json();
        renderTmuxOptions(data.available || []);
      } catch (err) {
        console.error('load tmux sessions failed:', err);
        showToast('加载 tmux session 列表失败');
      }
    }

    function selectedTmuxChoice() {
      const checked = tmuxOptions.querySelector('input[name="tmuxChoice"]:checked');
      return checked ? checked.value.trim() : '';
    }

    async function createSession(tmuxSession) {
      createConfirmBtn.disabled = true;
      addBtn.disabled = true;
      try {
        const opts = { ...fetchOpts, method: 'POST' };
        if (tmuxSession) {
          opts.headers = { 'Content-Type': 'application/json' };
          opts.body = JSON.stringify({ tmuxSession });
        }
        const res = await fetch('/api/sessions', opts);
        const data = await res.json();
        if (!res.ok) {
          showToast(data.error || '创建 session 失败');
          return;
        }
        closeCreateModal();
        grid.appendChild(createCell(data, grid.querySelectorAll('.cell').length));
        updateEmptyState();
      } catch (err) {
        showToast('网络错误: ' + err.message);
      } finally {
        createConfirmBtn.disabled = false;
        addBtn.disabled = false;
      }
    }

    createCancelBtn.addEventListener('click', closeCreateModal);
    createModal.addEventListener('click', (e) => {
      if (e.target === createModal) closeCreateModal();
    });
    createConfirmBtn.addEventListener('click', () => {
      createSession(selectedTmuxChoice());
    });

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && createModal.classList.contains('active')) {
        closeCreateModal();
      }
    });

    addBtn.addEventListener('click', () => {
      openCreateModal();
    });

    exitBtn.addEventListener('click', closeOverlay);

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && overlay.classList.contains('active')) {
        closeOverlay();
      }
    });

    renderSessions(initialSessions);
    loadSessions();
  </script>
</body>
</html>
