<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>Agent Control</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body, #grid, #overlay {
      scrollbar-width: thin;
      scrollbar-color: #1a1a1a #000;
    }

    html::-webkit-scrollbar,
    body::-webkit-scrollbar,
    #grid::-webkit-scrollbar,
    #overlay::-webkit-scrollbar {
      width: 4px;
      height: 4px;
    }

    html::-webkit-scrollbar-track,
    body::-webkit-scrollbar-track,
    #grid::-webkit-scrollbar-track,
    #overlay::-webkit-scrollbar-track {
      background: #000;
    }

    html::-webkit-scrollbar-thumb,
    body::-webkit-scrollbar-thumb,
    #grid::-webkit-scrollbar-thumb,
    #overlay::-webkit-scrollbar-thumb {
      background: #1a1a1a;
      border-radius: 2px;
    }

    html::-webkit-scrollbar-thumb:hover,
    body::-webkit-scrollbar-thumb:hover,
    #grid::-webkit-scrollbar-thumb:hover,
    #overlay::-webkit-scrollbar-thumb:hover {
      background: #333;
    }

    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #0f1117;
      color: #e6edf3;
      min-height: 100vh;
      min-width: 0;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 12px 20px;
      border-bottom: 1px solid #21262d;
      background: #161b22;
      min-width: 0;
    }

    .header-main {
      display: flex;
      align-items: center;
      gap: 16px;
      min-width: 0;
      flex: 1 1 0;
      overflow: hidden;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex: 0 0 auto;
    }

    .header-btn {
      background: #21262d;
      border: 1px solid #30363d;
      color: #e6edf3;
      padding: 6px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 12px;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .header-btn:hover { background: #30363d; }

    .header-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    header h1 {
      font-size: 16px;
      font-weight: 600;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .hint {
      font-size: 12px;
      color: #8b949e;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    #grid {
      display: flex;
      flex-wrap: wrap;
      align-content: flex-start;
      gap: 12px;
      padding: 16px;
      min-height: calc(100vh - 52px);
    }

    #grid.empty {
      place-items: center;
      align-content: center;
    }

    .cell {
      position: relative;
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
      width: 320px;
      height: 240px;
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 8px;
      overflow: hidden;
      cursor: default;
      transition: border-color 0.15s, box-shadow 0.15s;
    }

    .cell.resizing {
      transition: none;
      user-select: none;
    }

    .cell-resize-handle {
      position: absolute;
      right: 0;
      bottom: 0;
      width: 18px;
      height: 18px;
      z-index: 6;
      cursor: nwse-resize;
      touch-action: none;
    }

    .cell-resize-handle::before {
      content: '';
      position: absolute;
      right: 4px;
      bottom: 4px;
      width: 8px;
      height: 8px;
      border-right: 2px solid #484f58;
      border-bottom: 2px solid #484f58;
    }

    .cell-resize-handle:hover::before {
      border-color: #58a6ff;
    }

    .cell.expanded .cell-resize-handle {
      display: none;
    }

    .cell:hover {
      border-color: #58a6ff;
      box-shadow: 0 0 0 1px #58a6ff33;
    }

    .cell-header {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      padding: 6px 10px;
      background: #21262d;
      font-size: 12px;
      color: #8b949e;
      flex-shrink: 0;
      position: relative;
      z-index: 2;
      pointer-events: auto;
    }

    .cell-title-box {
      flex: 1;
      min-width: 0;
    }

    .cell-title-display {
      display: block;
      flex: 1;
      min-width: 0;
      color: #e6edf3 !important;
      font-size: 12px;
      line-height: 1.4;
      padding: 2px 6px;
      cursor: text;
      white-space: pre-wrap;
      word-break: break-word;
      overflow-wrap: anywhere;
      min-height: 22px;
      outline: none;
    }

    .cell-title-display:empty::before {
      content: attr(data-default);
      color: #8b949e;
    }

    .cell-title-display:hover {
      background: #0f111733;
      border-radius: 3px;
    }

    .cell-title-display:focus {
      background: #0f1117;
      box-shadow: 0 0 0 1px #58a6ff;
      border-radius: 3px;
    }

    .tmux-id {
      flex-shrink: 0;
      align-self: flex-start;
      margin-top: 3px;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 10px;
      color: #6e7681;
      background: #0f1117;
      border: 1px solid #30363d;
      border-radius: 3px;
      padding: 1px 5px;
      cursor: default;
      user-select: all;
    }

    .cell-backend-tag {
      flex-shrink: 0;
      align-self: flex-start;
      margin-top: 3px;
      font-size: 10px;
      color: #79c0ff;
      background: #1c2128;
      border: 1px solid rgba(56, 139, 253, 0.35);
      border-radius: 3px;
      padding: 1px 5px;
      max-width: 96px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      user-select: none;
    }

    .cell-recency-tag {
      display: none;
      flex-shrink: 0;
      align-self: flex-start;
      margin-top: 1px;
      min-width: 18px;
      height: 18px;
      padding: 0 4px;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 12px;
      font-weight: 700;
      line-height: 18px;
      text-align: center;
      color: #8b949e;
      background: #21262d;
      border: 1px solid #30363d;
      border-radius: 4px;
      font-variant-numeric: tabular-nums;
      user-select: none;
    }

    .cell-recency-tag.has-tag {
      display: inline-block;
    }

    .cell-recency-tag.is-latest {
      color: #fff;
      background: #238636;
      border-color: #2ea043;
    }

    .overlay-recency-tag {
      display: none;
      flex-shrink: 0;
      align-self: flex-start;
      margin-top: 4px;
      min-width: 22px;
      height: 24px;
      padding: 0 6px;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 14px;
      font-weight: 700;
      line-height: 24px;
      text-align: center;
      color: #8b949e;
      background: #21262d;
      border: 1px solid #30363d;
      border-radius: 4px;
      font-variant-numeric: tabular-nums;
      user-select: none;
    }

    .overlay-recency-tag.has-tag {
      display: inline-block;
    }

    .overlay-recency-tag.is-latest {
      color: #fff;
      background: #238636;
      border-color: #2ea043;
    }

    .overlay-title {
      flex: 1;
      min-width: 0;
      background: #0f1117;
      border: 1px solid #30363d;
      color: #e6edf3;
      font-size: 14px;
      line-height: 1.4;
      outline: none;
      padding: 4px 8px;
      resize: none;
      white-space: pre-wrap;
      word-break: break-word;
      overflow-wrap: anywhere;
      cursor: text;
      width: 100%;
      min-height: 28px;
      border-radius: 3px;
      box-sizing: border-box;
    }

    .cell-actions {
      display: flex;
      align-items: flex-start;
      gap: 2px;
      flex-shrink: 0;
    }

    .btn-icon {
      flex-shrink: 0;
      align-self: flex-start;
      margin-top: 1px;
      background: none;
      border: none;
      color: #8b949e;
      cursor: pointer;
      font-size: 14px;
      line-height: 1;
      padding: 0 4px;
    }

    .btn-icon:hover { color: #e6edf3; }

    .btn-maximize:hover { color: #58a6ff; }

    .btn-drag {
      font-size: 12px;
      letter-spacing: -1px;
      cursor: grab;
      touch-action: none;
    }

    .btn-drag:hover { color: #d2a8ff; }

    .btn-drag:active { cursor: grabbing; }

    .cell.dragging {
      opacity: 0.55;
      border-color: #d2a8ff;
      box-shadow: 0 0 0 1px #d2a8ff55;
    }

    .cell.drag-over {
      border-color: #d2a8ff;
      box-shadow: 0 0 0 2px #d2a8ff66;
    }

    .btn-close {
      font-size: 16px;
    }

    .btn-close:hover { color: #f85149; }

    .terminal-viewport {
      flex: 1;
      min-height: 0;
      overflow: hidden;
      position: relative;
      background: #000;
    }

    .terminal-frame {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      transform-origin: top left;
    }

    .terminal-frame iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
      background: #000;
      pointer-events: auto;
    }

    .cell.minimized .terminal-frame iframe {
      pointer-events: none;
    }

    .cell.minimized-active .terminal-frame iframe {
      pointer-events: auto;
    }

    .terminal-activator {
      display: none;
      position: absolute;
      inset: 0;
      z-index: 4;
      border: none;
      padding: 0;
      background: rgba(0, 0, 0, 0.5);
      color: #8b949e;
      font-size: 12px;
      cursor: pointer;
    }

    .cell.minimized:not(.minimized-active) .terminal-activator {
      display: block;
    }

    body.session-expanded {
      overflow: hidden;
    }

    /* iframe 会突破 z-index，最大化时隐藏其余格子 */
    body.session-expanded #grid .cell:not(.expanded),
    body.session-expanded #grid .cell-placeholder {
      visibility: hidden;
      pointer-events: none;
    }

    body.session-expanded #grid .cell.expanded {
      visibility: visible;
      pointer-events: auto;
    }

    .cell-placeholder {
      flex-shrink: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .cell.expanded {
      position: fixed;
      top: var(--overlay-bar-height, 49px);
      left: 0;
      right: 0;
      bottom: 0;
      width: 100vw !important;
      height: auto !important;
      z-index: 90;
      aspect-ratio: unset;
      border-radius: 0;
      border: none;
      cursor: default;
    }

    .cell.expanded:hover {
      border-color: transparent;
      box-shadow: none;
    }

    .cell.expanded .cell-header {
      display: none;
    }

    .cell.expanded .terminal-viewport {
      flex: 1;
    }

    .cell.expanded .terminal-frame {
      position: absolute;
      top: 0;
      left: 0;
    }

    .cell.expanded .terminal-frame iframe {
      pointer-events: auto;
    }

    .fab {
      position: fixed;
      right: 24px;
      bottom: 24px;
      width: 56px;
      height: 56px;
      border-radius: 50%;
      border: none;
      background: #238636;
      color: #fff;
      font-size: 32px;
      line-height: 1;
      cursor: pointer;
      box-shadow: 0 4px 16px #0008;
      transition: transform 0.15s, background 0.15s;
      z-index: 10;
    }

    .fab:hover {
      background: #2ea043;
      transform: scale(1.05);
    }

    .fab:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }

    /* fullscreen overlay — bar only; iframe stays in its cell */
    #overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 100;
      pointer-events: none;
    }

    #overlay.active { display: block; }

    .overlay-bar {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      padding: 10px 16px;
      background: #161b22;
      border-bottom: 1px solid #21262d;
      pointer-events: auto;
    }

    .overlay-bar span {
      display: none;
    }

    .overlay-actions { display: flex; gap: 8px; }

    .overlay-actions button {
      background: #21262d;
      border: 1px solid #30363d;
      color: #e6edf3;
      padding: 6px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 13px;
    }

    .overlay-actions button:hover { background: #30363d; }

    .overlay-body { display: none; }

    .empty-msg {
      text-align: center;
      color: #8b949e;
    }

    .empty-msg p { margin-top: 8px; font-size: 14px; }

    .toast {
      position: fixed;
      bottom: 90px;
      right: 24px;
      background: #da3633;
      color: #fff;
      padding: 10px 16px;
      border-radius: 6px;
      font-size: 13px;
      display: none;
      z-index: 200;
      max-width: 360px;
    }

    .toast.show { display: block; }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.55);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 150;
      padding: 24px;
    }

    .modal-backdrop.active { display: flex; }

    .modal {
      width: min(420px, 100%);
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 10px;
      box-shadow: 0 16px 48px rgba(0, 0, 0, 0.45);
      overflow: hidden;
    }

    .modal.settings-modal {
      width: min(520px, 100%);
    }

    .modal-header {
      padding: 16px 18px 8px;
      font-size: 16px;
      font-weight: 600;
      color: #e6edf3;
    }

    .modal-body {
      padding: 8px 18px 16px;
      color: #8b949e;
      font-size: 13px;
    }

    .tmux-options {
      margin-top: 12px;
      max-height: 220px;
      overflow-y: auto;
      border: 1px solid #21262d;
      border-radius: 8px;
      background: #0d1117;
    }

    .tmux-option {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 12px;
      border-bottom: 1px solid #21262d;
      cursor: pointer;
      color: #e6edf3;
    }

    .tmux-option:last-child { border-bottom: none; }

    .tmux-option:hover { background: #161b22; }

    .tmux-option input { accent-color: #238636; }

    .tmux-option-meta {
      margin-left: auto;
      font-size: 11px;
      color: #8b949e;
    }

    .tmux-empty {
      padding: 14px 12px;
      color: #8b949e;
      font-size: 13px;
    }

    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      padding: 12px 18px 16px;
      border-top: 1px solid #21262d;
    }

    .modal-actions button {
      background: #21262d;
      border: 1px solid #30363d;
      color: #e6edf3;
      padding: 8px 14px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 13px;
    }

    .modal-actions button:hover { background: #30363d; }

    .modal-actions button.primary {
      background: #238636;
      border-color: #238636;
      color: #fff;
    }

    .modal-actions button.primary:hover { background: #2ea043; }

    .modal-actions button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    /* --- Mobile layout --- */
    .mobile-only { display: none; }

    .overview-tap-catcher {
      display: none;
      position: absolute;
      inset: 0;
      z-index: 5;
      border: none;
      padding: 0;
      margin: 0;
      background: transparent;
      cursor: pointer;
    }

    .mobile-pager-top,
    .mobile-pager-bottom {
      display: none;
      position: fixed;
      left: 0;
      right: 0;
      z-index: 120;
      background: #161b22;
      border-color: #21262d;
      touch-action: pan-y;
    }

    .mobile-pager-top {
      top: 0;
      align-items: center;
      gap: 10px;
      padding: max(8px, env(safe-area-inset-top)) 12px 8px;
      border-bottom: 1px solid #21262d;
      min-height: 48px;
    }

    .mobile-pager-bottom {
      bottom: 0;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 10px 16px max(10px, env(safe-area-inset-bottom));
      border-top: 1px solid #21262d;
      min-height: 52px;
    }

    .mobile-pager-back {
      flex-shrink: 0;
      background: #21262d;
      border: 1px solid #30363d;
      color: #e6edf3;
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 13px;
      cursor: pointer;
    }

    .mobile-pager-title {
      flex: 1;
      min-width: 0;
      font-size: 14px;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .mobile-pager-dots {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }

    .mobile-pager-dot {
      width: 8px;
      height: 8px;
      padding: 0;
      border: none;
      border-radius: 50%;
      background: #484f58;
      cursor: pointer;
    }

    .mobile-pager-dot.active {
      background: #58a6ff;
      transform: scale(1.15);
    }

    .mobile-pager-nav {
      background: #21262d;
      border: 1px solid #30363d;
      color: #e6edf3;
      width: 44px;
      height: 44px;
      border-radius: 8px;
      font-size: 22px;
      line-height: 1;
      cursor: pointer;
    }

    .mobile-pager-nav:disabled {
      opacity: 0.35;
      cursor: not-allowed;
    }

    .mobile-pager-index {
      font-size: 13px;
      color: #8b949e;
      min-width: 64px;
      text-align: center;
    }

    .mobile-pager-settings {
      flex-shrink: 0;
      background: #21262d;
      border: 1px solid #30363d;
      color: #e6edf3;
      padding: 6px 10px;
      border-radius: 6px;
      font-size: 13px;
      cursor: pointer;
    }

    .settings-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-top: 14px;
    }

    .settings-row-label {
      font-size: 13px;
      color: #e6edf3;
    }

    .settings-row-hint {
      margin-top: 8px;
      font-size: 12px;
      color: #8b949e;
      line-height: 1.5;
    }

    .settings-section {
      margin-top: 20px;
      padding-top: 16px;
      border-top: 1px solid #21262d;
    }

    .settings-section-title {
      font-size: 13px;
      font-weight: 600;
      color: #e6edf3;
      margin-bottom: 6px;
    }

    .backend-list {
      margin-top: 10px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .backend-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 8px;
      align-items: start;
      padding: 10px;
      border: 1px solid #21262d;
      border-radius: 8px;
      background: #0d1117;
    }

    .backend-row.is-local {
      opacity: 0.85;
    }

    .backend-row.is-editing {
      border-color: #388bfd;
      box-shadow: 0 0 0 1px rgba(56, 139, 253, 0.35);
    }

    .backend-row.is-hidden-backend {
      opacity: 0.55;
    }

    .backend-row-actions button.is-active {
      color: #58a6ff;
      border-color: #388bfd;
    }

    .backend-row-main {
      min-width: 0;
    }

    .backend-row-name {
      font-size: 13px;
      color: #e6edf3;
      font-weight: 600;
    }

    .backend-row-url {
      margin-top: 2px;
      font-size: 11px;
      color: #8b949e;
      word-break: break-all;
    }

    .backend-row-actions {
      display: flex;
      gap: 6px;
      flex-shrink: 0;
    }

    .backend-row-actions button {
      background: #21262d;
      border: 1px solid #30363d;
      color: #e6edf3;
      padding: 4px 8px;
      border-radius: 6px;
      font-size: 11px;
      cursor: pointer;
    }

    .backend-row-actions button:hover {
      background: #30363d;
    }

    .backend-row-actions button.danger {
      color: #ff7b72;
    }

    .backend-add-form {
      margin-top: 12px;
      display: grid;
      gap: 8px;
    }

    .backend-add-form input {
      width: 100%;
      box-sizing: border-box;
      background: #0d1117;
      border: 1px solid #30363d;
      border-radius: 6px;
      color: #e6edf3;
      padding: 8px 10px;
      font-size: 13px;
    }

    .backend-add-actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .backend-add-actions button {
      background: #21262d;
      border: 1px solid #30363d;
      color: #e6edf3;
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 12px;
      cursor: pointer;
    }

    .backend-add-actions button.primary {
      background: #238636;
      border-color: #2ea043;
    }

    .create-backend-row {
      margin-bottom: 12px;
    }

    .create-backend-row label {
      display: block;
      margin-bottom: 6px;
      font-size: 13px;
      color: #e6edf3;
    }

    .create-backend-row select {
      width: 100%;
      box-sizing: border-box;
      background: #0d1117;
      border: 1px solid #30363d;
      border-radius: 6px;
      color: #e6edf3;
      padding: 8px 10px;
      font-size: 13px;
    }

    .font-size-controls {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .font-size-btn {
      background: #21262d;
      border: 1px solid #30363d;
      color: #e6edf3;
      min-width: 36px;
      height: 36px;
      padding: 0 8px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      line-height: 1;
      cursor: pointer;
    }

    .font-size-btn:disabled {
      opacity: 0.35;
      cursor: not-allowed;
    }

    .font-size-input {
      width: 52px;
      height: 36px;
      padding: 0 4px;
      border: 1px solid #30363d;
      border-radius: 8px;
      background: #0d1117;
      color: #e6edf3;
      font-size: 13px;
      text-align: center;
      font-variant-numeric: tabular-nums;
      -moz-appearance: textfield;
    }

    .font-size-input::-webkit-outer-spin-button,
    .font-size-input::-webkit-inner-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }

    .font-size-input:focus {
      outline: none;
      border-color: #58a6ff;
      box-shadow: 0 0 0 1px #58a6ff55;
    }

    @media (max-width: 768px) {
      .mobile-only { display: inline-flex; }

      html, body {
        overflow-x: hidden;
        max-width: 100%;
      }

      header {
        width: 100%;
        max-width: 100vw;
        box-sizing: border-box;
        padding: 8px 10px;
        padding-top: max(8px, env(safe-area-inset-top));
        gap: 8px;
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        align-items: center;
      }

      .header-main {
        gap: 0;
        min-width: 0;
        overflow: hidden;
      }

      header h1 {
        font-size: 12px;
        max-width: 100%;
      }

      .hint,
      #resetLayoutBtn,
      .header-main {
        display: none !important;
      }

      header {
        grid-template-columns: 1fr;
        justify-items: end;
      }

      .header-actions {
        gap: 6px;
        justify-self: end;
      }

      .header-btn {
        padding: 8px 12px;
        font-size: 12px;
        min-height: 36px;
      }

      #grid {
        width: 100%;
        max-width: 100vw;
        box-sizing: border-box;
        overflow-x: hidden;
      }

      #grid .cell {
        width: 100% !important;
        max-width: 100%;
        box-sizing: border-box;
      }

      body.mobile {
        overflow: hidden;
      }

      body.mobile header {
        padding: 8px 10px;
        padding-top: max(8px, env(safe-area-inset-top));
      }

      body.mobile header h1 {
        font-size: 12px;
      }

      body.mobile .hint,
      body.mobile #resetLayoutBtn,
      body.mobile .btn-drag,
      body.mobile .btn-maximize,
      body.mobile .cell-resize-handle {
        display: none !important;
      }

      body.mobile .fab {
        right: 16px;
        bottom: max(80px, calc(16px + env(safe-area-inset-bottom)));
        width: 52px;
        height: 52px;
        font-size: 28px;
      }

      body.mobile.mobile-overview #grid {
        display: flex;
        flex-direction: column;
        flex-wrap: nowrap;
        align-content: stretch;
        gap: 10px;
        padding: 12px;
        padding-bottom: max(88px, calc(12px + env(safe-area-inset-bottom)));
        overflow-x: hidden;
        overflow-y: auto;
        height: calc(100vh - 52px);
        height: calc(100dvh - 52px);
        min-height: 0;
        -webkit-overflow-scrolling: touch;
      }

      body.mobile.mobile-overview #grid.empty {
        place-items: center;
        justify-content: center;
      }

      body.mobile.mobile-overview .cell {
        width: 100% !important;
        height: 38vh !important;
        height: 38dvh !important;
        min-height: 200px;
        max-height: 320px;
        flex-shrink: 0;
      }

      body.mobile.mobile-overview .overview-tap-catcher {
        display: block;
      }

      body.mobile.mobile-overview .cell.minimized .terminal-activator {
        display: none;
      }

      body.mobile.mobile-pager {
        overflow: hidden;
      }

      body.mobile.mobile-pager header {
        display: none;
      }

      body.mobile.mobile-pager .mobile-pager-top,
      body.mobile.mobile-pager .mobile-pager-bottom {
        display: flex;
      }

      body.mobile.mobile-pager .fab {
        bottom: max(68px, calc(12px + env(safe-area-inset-bottom)));
      }

      body.mobile.mobile-pager #grid {
        display: flex;
        flex-direction: row;
        flex-wrap: nowrap;
        align-content: stretch;
        gap: 0;
        padding: 0;
        margin: 0;
        position: fixed;
        top: 48px;
        top: calc(48px + env(safe-area-inset-top));
        bottom: 52px;
        bottom: calc(52px + env(safe-area-inset-bottom));
        left: 0;
        right: 0;
        width: 100%;
        height: auto;
        min-height: 0;
        overflow-x: auto;
        overflow-y: hidden;
        scroll-snap-type: x mandatory;
        -webkit-overflow-scrolling: touch;
        scrollbar-width: none;
      }

      body.mobile.mobile-pager #grid::-webkit-scrollbar {
        display: none;
      }

      body.mobile.mobile-pager .cell {
        width: 100vw !important;
        height: 100% !important;
        min-height: 0;
        max-height: none;
        flex-shrink: 0;
        scroll-snap-align: start;
        scroll-snap-stop: always;
        border-radius: 0;
        border-left: none;
        border-right: none;
      }

      body.mobile.mobile-pager .cell-header {
        display: none;
      }

      body.mobile.mobile-pager .overview-tap-catcher {
        display: none !important;
      }

      body.mobile.mobile-pager .cell .terminal-frame iframe {
        pointer-events: auto;
      }

      body.mobile #overlay {
        display: none !important;
      }
    }
  </style>
</head>
<body>
  <header>
    <div class="header-main">
      <h1>Agent Control</h1>
      <span class="hint">拖动 ⠿ 排序 · 右下角拖大窗口 · ⤢ 放大 · Esc 最小化</span>
    </div>
    <div class="header-actions">
      <button type="button" class="header-btn mobile-only" id="mobileOverviewBtn" title="返回总览">总览</button>
      <button type="button" class="header-btn" id="settingsBtn" title="设置">设置</button>
      <button type="button" class="header-btn" id="resetLayoutBtn" title="所有窗口恢复默认大小">重置窗口</button>
    </div>
  </header>

  <div class="mobile-pager-top" id="mobilePagerTop">
    <button type="button" class="mobile-pager-back" id="mobileBackBtn">总览</button>
    <span class="mobile-pager-title" id="mobilePagerTitle"></span>
    <div class="mobile-pager-dots" id="mobilePagerDots"></div>
    <button type="button" class="mobile-pager-settings" id="mobileSettingsBtn" title="设置">设置</button>
  </div>

  <div class="mobile-pager-bottom" id="mobilePagerBottom">
    <button type="button" class="mobile-pager-nav" id="mobilePrevBtn" aria-label="上一个 session">‹</button>
    <span class="mobile-pager-index" id="mobilePagerIndex"></span>
    <button type="button" class="mobile-pager-nav" id="mobileNextBtn" aria-label="下一个 session">›</button>
  </div>

  <div id="grid" class="empty">
    <div class="empty-msg">
      <div style="font-size:48px;opacity:0.3">+</div>
      <p>点击右下角加号创建终端 session</p>
    </div>
  </div>

  <button class="fab" id="addBtn" title="新建 session">+</button>

  <div id="overlay">
    <div class="overlay-bar">
      <span id="overlayRecencyTag" class="overlay-recency-tag" aria-label="操作序号"></span>
      <textarea id="overlayTitle" class="overlay-title" rows="1" placeholder="点击输入备注..."></textarea>
      <div class="overlay-actions">
        <button id="exitBtn">最小化 (Esc)</button>
      </div>
    </div>
    <div class="overlay-body"></div>
  </div>

  <div class="toast" id="toast"></div>

  <div class="modal-backdrop" id="settingsModal">
    <div class="modal settings-modal" role="dialog" aria-labelledby="settingsModalTitle">
      <div class="modal-header" id="settingsModalTitle">设置</div>
      <div class="modal-body">
        <div class="settings-row">
          <span class="settings-row-label">终端字号</span>
          <div class="font-size-controls">
            <button type="button" class="font-size-btn" id="settingsFontDown" aria-label="减小终端字体">A−</button>
            <input type="number" class="font-size-input" id="settingsFontSizeInput" inputmode="numeric" min="6" max="24" step="1" aria-label="终端字号">
            <button type="button" class="font-size-btn" id="settingsFontUp" aria-label="增大终端字体">A+</button>
          </div>
        </div>
        <p class="settings-row-hint">范围 6–24，对所有 tmux 终端生效。调整完成后点击「完成」才会重载终端页面。</p>
        <div class="settings-section">
          <div class="settings-section-title">远程后端</div>
          <p class="settings-row-hint">聚合多台 TMUX Ctl 的 session；远程实例无需修改，填写地址与 token 即可。配置保存在服务器，换浏览器也会保留。点「隐藏」可暂时不显示该后端的 session。</p>
          <div class="backend-list" id="backendList"></div>
          <div class="backend-add-form">
            <input type="text" id="backendAddName" placeholder="名称，如 xcomx300-1" autocomplete="off">
            <input type="url" id="backendAddUrl" placeholder="http://xcomx300-1:5001" autocomplete="off">
            <input type="password" id="backendAddToken" placeholder="Token（Bearer）" autocomplete="off">
            <div class="backend-add-actions">
              <button type="button" id="backendTestBtn">测试连接</button>
              <button type="button" id="backendCancelEditBtn" hidden>取消编辑</button>
              <button type="button" class="primary" id="backendAddBtn">添加后端</button>
            </div>
          </div>
        </div>
      </div>
      <div class="modal-actions">
        <button type="button" class="primary" id="settingsCloseBtn">完成</button>
      </div>
    </div>
  </div>

  <div class="modal-backdrop" id="createModal">
    <div class="modal" role="dialog" aria-labelledby="createModalTitle">
      <div class="modal-header" id="createModalTitle">新建 session</div>
      <div class="modal-body">
        <div class="create-backend-row">
          <label for="createBackendSelect">目标后端</label>
          <select id="createBackendSelect"></select>
        </div>
        <p>选择复用已有 tmux session，或新建一个。</p>
        <div class="tmux-options" id="tmuxOptions">
          <label class="tmux-option">
            <input type="radio" name="tmuxChoice" value="" checked>
            <span>新建 tmux session</span>
          </label>
        </div>
      </div>
      <div class="modal-actions">
        <button type="button" id="createCancelBtn">取消</button>
        <button type="button" class="primary" id="createConfirmBtn">创建</button>
      </div>
    </div>
  </div>

  <script>
    const initialSessions = {{ initial_sessions | tojson }};
    const fetchOpts = { cache: 'no-store', credentials: 'same-origin' };
    const grid = document.getElementById('grid');
    const addBtn = document.getElementById('addBtn');
    const resetLayoutBtn = document.getElementById('resetLayoutBtn');
    const settingsBtn = document.getElementById('settingsBtn');
    const settingsModal = document.getElementById('settingsModal');
    const settingsFontDown = document.getElementById('settingsFontDown');
    const settingsFontUp = document.getElementById('settingsFontUp');
    const settingsFontSizeInput = document.getElementById('settingsFontSizeInput');
    const settingsCloseBtn = document.getElementById('settingsCloseBtn');
    const backendList = document.getElementById('backendList');
    const backendAddName = document.getElementById('backendAddName');
    const backendAddUrl = document.getElementById('backendAddUrl');
    const backendAddToken = document.getElementById('backendAddToken');
    const backendTestBtn = document.getElementById('backendTestBtn');
    const backendCancelEditBtn = document.getElementById('backendCancelEditBtn');
    const backendAddBtn = document.getElementById('backendAddBtn');
    const overlay = document.getElementById('overlay');
    const overlayTitle = document.getElementById('overlayTitle');
    const overlayRecencyTag = document.getElementById('overlayRecencyTag');
    const exitBtn = document.getElementById('exitBtn');
    const toast = document.getElementById('toast');
    const createModal = document.getElementById('createModal');
    const createBackendSelect = document.getElementById('createBackendSelect');
    const tmuxOptions = document.getElementById('tmuxOptions');
    const createCancelBtn = document.getElementById('createCancelBtn');
    const createConfirmBtn = document.getElementById('createConfirmBtn');
    const mobileOverviewBtn = document.getElementById('mobileOverviewBtn');
    const mobilePagerTop = document.getElementById('mobilePagerTop');
    const mobilePagerBottom = document.getElementById('mobilePagerBottom');
    const mobileBackBtn = document.getElementById('mobileBackBtn');
    const mobilePagerTitle = document.getElementById('mobilePagerTitle');
    const mobilePagerDots = document.getElementById('mobilePagerDots');
    const mobilePrevBtn = document.getElementById('mobilePrevBtn');
    const mobileNextBtn = document.getElementById('mobileNextBtn');
    const mobilePagerIndexEl = document.getElementById('mobilePagerIndex');
    const mobileSettingsBtn = document.getElementById('mobileSettingsBtn');

    const FONT_SIZE_KEY = 'tmux_ctl_font_size';
    const FONT_SIZE_MIN = 6;
    const FONT_SIZE_MAX = 24;
    const FONT_SIZE_STEP = 1;
    const FONT_SIZE_DEFAULT_DESKTOP = 14;
    const FONT_SIZE_DEFAULT_MOBILE = 16;

    const BACKENDS_KEY = 'tmux_ctl_backends';
    const LAYOUT_KEY = 'tmux_ctl_federated_layout';
    const HIDDEN_BACKENDS_KEY = 'tmux_ctl_hidden_backends';
    const LOCAL_BACKEND_ID = 'local';

    let remoteBackends = [];
    let localBackendHidden = false;
    let draftRemoteBackends = null;
    let createBackendId = LOCAL_BACKEND_ID;
    let editingBackendId = null;

    function loadLegacyBackendsFromLocalStorage() {
      try {
        const raw = localStorage.getItem(BACKENDS_KEY);
        const list = raw ? JSON.parse(raw) : [];
        if (!Array.isArray(list)) return [];
        return list.filter((b) => b && b.id && b.baseUrl).map(normalizeBackendRecord);
      } catch {
        return [];
      }
    }

    function loadLegacyHiddenFromLocalStorage() {
      try {
        const raw = localStorage.getItem(HIDDEN_BACKENDS_KEY);
        const list = raw ? JSON.parse(raw) : [];
        if (!Array.isArray(list)) return new Set();
        return new Set(list.filter(Boolean).map(String));
      } catch {
        return new Set();
      }
    }

    function applyBackendState(data) {
      localBackendHidden = Boolean(data.localHidden);
      remoteBackends = (data.backends || []).map(normalizeBackendRecord);
    }

    async function fetchBackendsFromServer() {
      const res = await fetch('/api/backends', fetchOpts);
      if (!res.ok) {
        const data = await res.json().catch(() => ({}));
        throw new Error(data.error || `HTTP ${res.status}`);
      }
      return res.json();
    }

    async function persistBackendsToServer(backends, localHidden = localBackendHidden) {
      const res = await fetch('/api/backends', {
        ...fetchOpts,
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          localHidden,
          backends: backends.map((backend) => ({
            id: backend.id,
            name: backend.name,
            baseUrl: backend.baseUrl,
            token: backend.token,
            hidden: Boolean(backend.hidden),
          })),
        }),
      });
      if (!res.ok) {
        const data = await res.json().catch(() => ({}));
        throw new Error(data.error || `HTTP ${res.status}`);
      }
      applyBackendState(await res.json());
    }

    async function initBackends() {
      try {
        const data = await fetchBackendsFromServer();
        const legacyBackends = loadLegacyBackendsFromLocalStorage();
        const legacyHidden = loadLegacyHiddenFromLocalStorage();
        const needsMigration =
          (!data.backends || data.backends.length === 0)
          && !data.localHidden
          && (legacyBackends.length > 0 || legacyHidden.size > 0);
        if (needsMigration) {
          localBackendHidden = legacyHidden.has(LOCAL_BACKEND_ID);
          remoteBackends = legacyBackends.map((backend) => ({
            ...backend,
            hidden: legacyHidden.has(backend.id),
          }));
          await persistBackendsToServer(remoteBackends, localBackendHidden);
          localStorage.removeItem(BACKENDS_KEY);
          localStorage.removeItem(HIDDEN_BACKENDS_KEY);
          showToast('已将浏览器中的远程后端配置迁移到服务器');
          return;
        }
        applyBackendState(data);
      } catch (err) {
        console.error('initBackends failed:', err);
        const legacyHidden = loadLegacyHiddenFromLocalStorage();
        remoteBackends = loadLegacyBackendsFromLocalStorage().map((backend) => ({
          ...backend,
          hidden: legacyHidden.has(backend.id),
        }));
        localBackendHidden = legacyHidden.has(LOCAL_BACKEND_ID);
      }
    }

    function isBackendHidden(backendId) {
      if (backendId === LOCAL_BACKEND_ID) return localBackendHidden;
      const list = draftRemoteBackends ?? remoteBackends;
      const backend = list.find((item) => item.id === backendId);
      return Boolean(backend?.hidden);
    }

    async function toggleBackendHidden(backendId) {
      if (backendId === LOCAL_BACKEND_ID) {
        localBackendHidden = !localBackendHidden;
      } else {
        const lists = [remoteBackends];
        if (draftRemoteBackends) lists.push(draftRemoteBackends);
        for (const list of lists) {
          const backend = list.find((item) => item.id === backendId);
          if (backend) backend.hidden = !backend.hidden;
        }
      }
      try {
        await persistBackendsToServer(
          draftRemoteBackends ?? remoteBackends,
          localBackendHidden
        );
      } catch (err) {
        showToast('保存后端设置失败: ' + err.message);
        throw err;
      }
    }

    function backendHideButtonLabel(backendId) {
      return isBackendHidden(backendId) ? '显示' : '隐藏';
    }

    function getVisibleBackends() {
      return getAllBackends().filter((backend) => !isBackendHidden(backend.id));
    }

    function filterSessionsByVisibleBackends(sessions) {
      return sessions.filter((session) => !isBackendHidden(session.backendId));
    }

    function normalizeBackendRecord(backend) {
      return {
        id: String(backend.id),
        name: String(backend.name || backend.id).trim() || String(backend.id),
        baseUrl: String(backend.baseUrl || '').trim().replace(/\/$/, ''),
        token: String(backend.token || ''),
        hidden: Boolean(backend.hidden),
      };
    }

    function getLocalBackend() {
      return {
        id: LOCAL_BACKEND_ID,
        name: '本机',
        baseUrl: '',
        token: '',
        isLocal: true,
      };
    }

    function getAllBackends() {
      return [getLocalBackend(), ...remoteBackends];
    }

    function getBackendById(backendId) {
      if (backendId === LOCAL_BACKEND_ID) return getLocalBackend();
      return remoteBackends.find((b) => b.id === backendId) || null;
    }

    function splitCompositeId(compositeId) {
      const idx = compositeId.indexOf(':');
      if (idx < 0) {
        return { backendId: LOCAL_BACKEND_ID, remoteId: compositeId };
      }
      return {
        backendId: compositeId.slice(0, idx),
        remoteId: compositeId.slice(idx + 1),
      };
    }

    function compositeId(backendId, remoteId) {
      return `${backendId}:${remoteId}`;
    }

    function slugBackendId(name, baseUrl) {
      try {
        const host = new URL(baseUrl).hostname.replace(/\./g, '-');
        return `${host}-${Math.random().toString(36).slice(2, 6)}`;
      } catch {
        const base = (name || 'remote')
          .toLowerCase()
          .replace(/[^a-z0-9]+/g, '-')
          .replace(/^-|-$/g, '');
        return `${base || 'remote'}-${Math.random().toString(36).slice(2, 6)}`;
      }
    }

    function normalizeLocalSession(raw) {
      const remoteId = raw.id;
      return {
        ...raw,
        id: compositeId(LOCAL_BACKEND_ID, remoteId),
        remoteId,
        backendId: LOCAL_BACKEND_ID,
        backendName: getLocalBackend().name,
        isLocal: true,
      };
    }

    function normalizeRemoteSession(raw, backend) {
      const remoteId = raw.id;
      return {
        ...raw,
        id: compositeId(backend.id, remoteId),
        remoteId,
        backendId: backend.id,
        backendName: backend.name,
        isLocal: false,
      };
    }

    function loadFederatedLayout() {
      try {
        const raw = localStorage.getItem(LAYOUT_KEY);
        return raw ? JSON.parse(raw) : { order: [], sizes: {} };
      } catch {
        return { order: [], sizes: {} };
      }
    }

    function saveFederatedLayout(partial) {
      const layout = { ...loadFederatedLayout(), ...partial };
      localStorage.setItem(LAYOUT_KEY, JSON.stringify(layout));
    }

    function hasRemoteBackends() {
      return remoteBackends.length > 0;
    }

    function applyFederatedLayoutOverrides(sessions) {
      const sizes = loadFederatedLayout().sizes || {};
      return sessions.map((session, index) => {
        const size = sizes[session.id];
        if (size) {
          session.width = size.width ?? session.width;
          session.height = size.height ?? session.height;
        }
        return normalizeSession(session, index);
      });
    }

    function sortSessionsByLayout(sessions) {
      const order = loadFederatedLayout().order || [];
      if (!order.length) return sessions;
      const map = new Map(sessions.map((session) => [session.id, session]));
      const sorted = [];
      for (const id of order) {
        if (map.has(id)) {
          sorted.push(map.get(id));
          map.delete(id);
        }
      }
      for (const session of map.values()) sorted.push(session);
      return sorted;
    }

    async function apiForBackend(backend, path, options = {}) {
      const method = options.method || 'GET';
      const headers = { ...(options.headers || {}) };
      const body = options.body;
      if (backend.isLocal) {
        const opts = { ...fetchOpts, method, headers };
        if (body !== undefined) {
          headers['Content-Type'] = headers['Content-Type'] || 'application/json';
          opts.headers = headers;
          opts.body = typeof body === 'string' ? body : JSON.stringify(body);
        }
        return fetch(path, opts);
      }
      return fetch('/api/federation/request', {
        ...fetchOpts,
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          baseUrl: backend.baseUrl,
          path,
          method,
          token: backend.token,
          body: body ?? null,
        }),
      });
    }

    function sessionApiPath(session) {
      return `/api/sessions/${session.remoteId}`;
    }

    function renderBackendList() {
      const list = draftRemoteBackends ?? remoteBackends;
      backendList.innerHTML = '';

      const localHidden = isBackendHidden(LOCAL_BACKEND_ID);
      const localRow = document.createElement('div');
      localRow.className = 'backend-row is-local' + (localHidden ? ' is-hidden-backend' : '');
      localRow.innerHTML = `
        <div class="backend-row-main">
          <div class="backend-row-name">本机</div>
          <div class="backend-row-url">当前 TMUX Ctl 实例（默认）</div>
        </div>
        <div class="backend-row-actions">
          <button type="button" class="${localHidden ? 'is-active' : ''}" data-action="toggle-hide" data-id="${LOCAL_BACKEND_ID}">${backendHideButtonLabel(LOCAL_BACKEND_ID)}</button>
        </div>
      `;
      backendList.appendChild(localRow);

      list.forEach((backend) => {
        const hidden = isBackendHidden(backend.id);
        const row = document.createElement('div');
        row.className = 'backend-row'
          + (backend.id === editingBackendId ? ' is-editing' : '')
          + (hidden ? ' is-hidden-backend' : '');
        row.innerHTML = `
          <div class="backend-row-main">
            <div class="backend-row-name">${escapeHtml(backend.name)}</div>
            <div class="backend-row-url">${escapeHtml(backend.baseUrl)}</div>
          </div>
          <div class="backend-row-actions">
            <button type="button" class="${hidden ? 'is-active' : ''}" data-action="toggle-hide" data-id="${escapeHtml(backend.id)}">${backendHideButtonLabel(backend.id)}</button>
            <button type="button" data-action="edit" data-id="${escapeHtml(backend.id)}">编辑</button>
            <button type="button" data-action="test" data-id="${escapeHtml(backend.id)}">测试</button>
            <button type="button" class="danger" data-action="remove" data-id="${escapeHtml(backend.id)}">删除</button>
          </div>
        `;
        backendList.appendChild(row);
      });
    }

    function resetBackendAddForm() {
      editingBackendId = null;
      backendAddName.value = '';
      backendAddUrl.value = '';
      backendAddToken.value = '';
      backendAddToken.placeholder = 'Token（Bearer）';
      backendAddBtn.textContent = '添加后端';
      backendCancelEditBtn.hidden = true;
    }

    function startEditBackend(backend) {
      editingBackendId = backend.id;
      backendAddName.value = backend.name;
      backendAddUrl.value = backend.baseUrl;
      backendAddToken.value = '';
      backendAddToken.placeholder = '留空则保持原 token';
      backendAddBtn.textContent = '保存修改';
      backendCancelEditBtn.hidden = false;
      renderBackendList();
      backendAddName.focus();
      backendAddName.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
    }

    function ensureDraftRemoteBackends() {
      if (!draftRemoteBackends) {
        draftRemoteBackends = remoteBackends.map((backend) => ({ ...backend }));
      }
    }

    function escapeHtml(text) {
      return String(text)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    async function testBackendConnection(backend) {
      const res = await apiForBackend(backend, '/api/sessions');
      if (!res.ok) {
        const data = await res.json().catch(() => ({}));
        throw new Error(data.error || `HTTP ${res.status}`);
      }
      const sessions = await res.json();
      return Array.isArray(sessions) ? sessions.length : 0;
    }

    function readBackendDraftFromForm() {
      return {
        name: backendAddName.value.trim(),
        baseUrl: backendAddUrl.value.trim().replace(/\/$/, ''),
        token: backendAddToken.value.trim(),
      };
    }

    function renderCreateBackendSelect() {
      createBackendSelect.innerHTML = '';
      getAllBackends().forEach((backend) => {
        const option = document.createElement('option');
        option.value = backend.id;
        option.textContent = backend.name;
        createBackendSelect.appendChild(option);
      });
      if (!getBackendById(createBackendId)) {
        createBackendId = LOCAL_BACKEND_ID;
      }
      createBackendSelect.value = createBackendId;
    }

    async function loadAllSessions() {
      const backends = getVisibleBackends();
      if (!backends.length) {
        renderSessions([]);
        return;
      }
      const batches = await Promise.allSettled(
        backends.map(async (backend) => {
          const res = await apiForBackend(backend, '/api/sessions');
          if (!res.ok) {
            const data = await res.json().catch(() => ({}));
            throw new Error(data.error || `HTTP ${res.status}`);
          }
          const rows = await res.json();
          return rows.map((row) =>
            backend.isLocal ? normalizeLocalSession(row) : normalizeRemoteSession(row, backend)
          );
        })
      );

      const failed = [];
      let merged = [];
      batches.forEach((result, index) => {
        const backend = backends[index];
        if (result.status === 'fulfilled') {
          merged = merged.concat(result.value);
        } else {
          failed.push(backend.name);
          console.error(`load sessions from ${backend.name} failed:`, result.reason);
        }
      });

      merged = applyFederatedLayoutOverrides(merged);
      if (hasRemoteBackends()) {
        merged = sortSessionsByLayout(merged);
      }
      renderSessions(merged);
      if (failed.length) {
        showToast(`部分后端加载失败: ${failed.join(', ')}`);
      }
    }

    let activeView = null;
    let isMobile = false;
    let mobilePagerIndex = 0;
    let mobileSwipeStartX = 0;
    const MOBILE_SWIPE_THRESHOLD = 40;
    const mobileQuery = window.matchMedia('(max-width: 768px) and (pointer: coarse)');

    function gridCells() {
      return [...grid.querySelectorAll('.cell')];
    }

    // 按「最近操作顺序」排列的 session id 列表（最近在前 = 0）
    let recencyOrder = [];

    function bumpRecency(sessionId) {
      if (!sessionId) return;
      const idx = recencyOrder.indexOf(sessionId);
      if (idx === 0) return;
      if (idx > 0) recencyOrder.splice(idx, 1);
      recencyOrder.unshift(sessionId);
      updateRecencyTags();
    }

    function removeRecency(sessionId) {
      const idx = recencyOrder.indexOf(sessionId);
      if (idx >= 0) {
        recencyOrder.splice(idx, 1);
        updateRecencyTags();
      }
    }

    function mergeRecencyAfterRender(sessionIds) {
      const alive = new Set(sessionIds);
      recencyOrder = recencyOrder.filter((id) => alive.has(id));
    }

    function updateRecencyTags() {
      gridCells().forEach((cell) => {
        const tagEl = cell.querySelector('.cell-recency-tag');
        if (!tagEl) return;
        const rank = recencyOrder.indexOf(cell.dataset.id);
        if (rank < 0) {
          tagEl.classList.remove('has-tag', 'is-latest');
          tagEl.textContent = '';
        } else {
          tagEl.classList.add('has-tag');
          tagEl.classList.toggle('is-latest', rank === 0);
          tagEl.textContent = String(rank);
        }
      });
      updateOverlayRecencyTag();
    }

    function updateOverlayRecencyTag() {
      if (!overlayRecencyTag) return;
      const id = activeView?.session?.id;
      const rank = id ? recencyOrder.indexOf(id) : -1;
      if (rank < 0) {
        overlayRecencyTag.classList.remove('has-tag', 'is-latest');
        overlayRecencyTag.textContent = '';
      } else {
        overlayRecencyTag.classList.add('has-tag');
        overlayRecencyTag.classList.toggle('is-latest', rank === 0);
        overlayRecencyTag.textContent = String(rank);
      }
    }

    function buildTtydUrl(baseUrl, fontSize) {
      try {
        const url = new URL(baseUrl, window.location.origin);
        url.searchParams.set('fontSize', String(fontSize));
        return url.href;
      } catch {
        const sep = baseUrl.includes('?') ? '&' : '?';
        return `${baseUrl}${sep}fontSize=${fontSize}`;
      }
    }

    function getTerminalFontSize() {
      const stored = localStorage.getItem(FONT_SIZE_KEY);
      if (stored !== null) {
        const value = parseInt(stored, 10);
        if (Number.isFinite(value)) {
          return Math.max(FONT_SIZE_MIN, Math.min(FONT_SIZE_MAX, value));
        }
      }
      return isMobile ? FONT_SIZE_DEFAULT_MOBILE : FONT_SIZE_DEFAULT_DESKTOP;
    }

    function normalizeTtydBaseUrl(url) {
      try {
        const parsed = new URL(url, window.location.origin);
        parsed.searchParams.delete('fontSize');
        const qs = parsed.searchParams.toString();
        return qs ? `${parsed.origin}${parsed.pathname}?${qs}` : `${parsed.origin}${parsed.pathname}`;
      } catch {
        return url.replace(/([?&])fontSize=\d+(&|$)/, (_, sep, tail) => (tail ? sep : '')).replace(/[?&]$/, '');
      }
    }

    function clampFontSize(size) {
      return Math.max(FONT_SIZE_MIN, Math.min(FONT_SIZE_MAX, size));
    }

    function readDraftFontSize() {
      const raw = settingsFontSizeInput.value.trim();
      const value = parseInt(raw, 10);
      if (!Number.isFinite(value)) return getTerminalFontSize();
      return clampFontSize(value);
    }

    function updateFontSizeControls(draftSize) {
      const size = draftSize !== undefined ? clampFontSize(draftSize) : getTerminalFontSize();
      settingsFontSizeInput.value = String(size);
      settingsFontDown.disabled = size <= FONT_SIZE_MIN;
      settingsFontUp.disabled = size >= FONT_SIZE_MAX;
    }

    function changeDraftFontSize(delta) {
      const next = clampFontSize(readDraftFontSize() + delta * FONT_SIZE_STEP);
      updateFontSizeControls(next);
    }

    function applySettingsFontSize() {
      const raw = settingsFontSizeInput.value.trim();
      const value = parseInt(raw, 10);
      if (!Number.isFinite(value)) {
        showToast(`请输入 ${FONT_SIZE_MIN}–${FONT_SIZE_MAX} 之间的整数`);
        updateFontSizeControls(getTerminalFontSize());
        return false;
      }
      const clamped = clampFontSize(value);
      const prev = getTerminalFontSize();
      localStorage.setItem(FONT_SIZE_KEY, String(clamped));
      updateFontSizeControls(clamped);
      if (clamped !== prev) {
        applyFontSizeToAllIframes(clamped);
        showToast(`终端字号: ${clamped}`);
      }
      return true;
    }

    function openSettingsModal() {
      updateFontSizeControls(getTerminalFontSize());
      resetBackendAddForm();
      draftRemoteBackends = remoteBackends.map((backend) => ({ ...backend }));
      renderBackendList();
      settingsModal.classList.add('active');
    }

    async function confirmSettingsModal() {
      if (!applySettingsFontSize()) return;
      if (draftRemoteBackends) {
        try {
          await persistBackendsToServer(draftRemoteBackends, localBackendHidden);
          draftRemoteBackends = null;
        } catch (err) {
          showToast('保存后端设置失败: ' + err.message);
          return;
        }
      }
      settingsModal.classList.remove('active');
      loadAllSessions();
    }

    function cancelSettingsModal() {
      updateFontSizeControls(getTerminalFontSize());
      resetBackendAddForm();
      draftRemoteBackends = null;
      settingsModal.classList.remove('active');
    }

    function applyFontSizeToAllIframes(fontSize) {
      grid.querySelectorAll('.cell iframe').forEach((iframe) => {
        if (!iframe.dataset.ttydBase) {
          iframe.dataset.ttydBase = normalizeTtydBaseUrl(iframe.src);
        }
        const nextSrc = buildTtydUrl(iframe.dataset.ttydBase, fontSize);
        if (iframe.src !== nextSrc) {
          iframe.src = nextSrc;
        }
      });
      requestAnimationFrame(() => {
        if (document.body.classList.contains('mobile-pager')) {
          setMobilePagerIndex(mobilePagerIndex, false);
        } else {
          refreshAllCellFrames();
        }
      });
    }

    function initTerminalIframe(iframe, baseUrl) {
      iframe.dataset.ttydBase = normalizeTtydBaseUrl(baseUrl);
      iframe.src = buildTtydUrl(iframe.dataset.ttydBase, getTerminalFontSize());
    }

    function refreshAllCellFrames() {
      gridCells().forEach((cell) => {
        fitFrameToGrid(cell);
      });
    }

    function renderMobilePagerDots() {
      mobilePagerDots.innerHTML = '';
      gridCells().forEach((cell, i) => {
        const dot = document.createElement('button');
        dot.type = 'button';
        dot.className = 'mobile-pager-dot';
        if (i === mobilePagerIndex) dot.classList.add('active');
        dot.setAttribute('aria-label', `Session ${i + 1}`);
        dot.addEventListener('click', () => setMobilePagerIndex(i));
        mobilePagerDots.appendChild(dot);
      });
    }

    function updateMobilePagerChrome() {
      const cells = gridCells();
      if (!cells.length) {
        mobilePagerTitle.textContent = '';
        mobilePagerIndexEl.textContent = '';
        return;
      }
      mobilePagerIndex = Math.max(0, Math.min(mobilePagerIndex, cells.length - 1));
      const cell = cells[mobilePagerIndex];
      const titleEl = cell.querySelector('.cell-title-display');
      const baseTitle = (titleEl?.textContent || '').trim() || `session-${mobilePagerIndex + 1}`;
      const rank = recencyOrder.indexOf(cell.dataset.id);
      const backendPrefix = hasRemoteBackends() && cell.dataset.backendName
        ? `[${cell.dataset.backendName}] `
        : '';
      mobilePagerTitle.textContent = rank >= 0
        ? `${backendPrefix}${rank} · ${baseTitle}`
        : `${backendPrefix}${baseTitle}`;
      mobilePagerIndexEl.textContent = `${mobilePagerIndex + 1} / ${cells.length}`;
      mobilePagerDots.querySelectorAll('.mobile-pager-dot').forEach((dot, i) => {
        dot.classList.toggle('active', i === mobilePagerIndex);
      });
      mobilePrevBtn.disabled = mobilePagerIndex <= 0;
      mobileNextBtn.disabled = mobilePagerIndex >= cells.length - 1;
    }

    function setMobilePagerIndex(index, smooth = true) {
      const cells = gridCells();
      if (!cells.length) return;
      mobilePagerIndex = Math.max(0, Math.min(index, cells.length - 1));
      const cell = cells[mobilePagerIndex];
      bumpRecency(cell.dataset.id);
      cell.scrollIntoView({
        behavior: smooth ? 'smooth' : 'auto',
        inline: 'start',
        block: 'nearest',
      });
      requestAnimationFrame(() => {
        fitFrameToGrid(cell);
        cell.classList.remove('minimized');
        cell.classList.remove('minimized-active');
        updateMobilePagerChrome();
      });
    }

    function goMobilePager(delta) {
      setMobilePagerIndex(mobilePagerIndex + delta);
    }

    function enterMobilePager(cell) {
      if (!isMobile) return;
      const cells = gridCells();
      const index = cells.indexOf(cell);
      if (index < 0) return;
      if (activeView) minimizeSession();
      document.body.classList.remove('mobile-overview');
      document.body.classList.add('mobile-pager');
      mobileOverviewBtn.style.display = 'inline-flex';
      mobilePagerIndex = index;
      renderMobilePagerDots();
      requestAnimationFrame(() => {
        setMobilePagerIndex(index, false);
      });
    }

    function exitMobilePager() {
      if (!isMobile) return;
      document.body.classList.remove('mobile-pager');
      document.body.classList.add('mobile-overview');
      mobileOverviewBtn.style.display = 'none';
      grid.scrollTop = 0;
      requestAnimationFrame(refreshAllCellFrames);
    }

    function applyMobileMode() {
      isMobile = mobileQuery.matches;
      if (isMobile) {
        document.body.classList.add('mobile');
        if (!document.body.classList.contains('mobile-pager')) {
          document.body.classList.add('mobile-overview');
          document.body.classList.remove('mobile-pager');
          mobileOverviewBtn.style.display = 'none';
        } else {
          mobileOverviewBtn.style.display = 'inline-flex';
        }
        if (activeView) minimizeSession();
        requestAnimationFrame(refreshAllCellFrames);
        setCellsDraggable(false);
        return;
      }

      document.body.classList.remove('mobile', 'mobile-overview', 'mobile-pager');
      mobileOverviewBtn.style.display = 'none';
      setCellsDraggable(true);
      if (activeView) {
        requestAnimationFrame(() => fitFrameToGrid(activeView.cell));
      } else {
        requestAnimationFrame(refreshAllCellFrames);
      }
    }

    function attachMobileSwipeNav(el) {
      el.addEventListener('touchstart', (e) => {
        if (e.touches.length !== 1) return;
        mobileSwipeStartX = e.touches[0].clientX;
      }, { passive: true });

      el.addEventListener('touchend', (e) => {
        if (!document.body.classList.contains('mobile-pager')) return;
        const dx = e.changedTouches[0].clientX - mobileSwipeStartX;
        if (Math.abs(dx) < MOBILE_SWIPE_THRESHOLD) return;
        if (dx < 0) goMobilePager(1);
        else goMobilePager(-1);
      }, { passive: true });
    }

    function showToast(msg) {
      toast.textContent = msg;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 4000);
    }

    function updateEmptyState() {
      const cells = grid.querySelectorAll('.cell');
      const emptyMsg = grid.querySelector('.empty-msg');
      if (cells.length === 0) {
        grid.classList.add('empty');
        if (!emptyMsg) {
          const div = document.createElement('div');
          div.className = 'empty-msg';
          div.innerHTML = '<div style="font-size:48px;opacity:0.3">+</div><p>点击右下角加号创建终端 session</p>';
          grid.appendChild(div);
        }
      } else {
        grid.classList.remove('empty');
        if (emptyMsg) emptyMsg.remove();
      }
    }

    function defaultLabel(session, index) {
      const title = (session.title || '').trim();
      const fallback = (session.defaultTitle || '').trim() || `session-${index + 1}`;
      return title || fallback;
    }

    function normalizeSession(session, index) {
      const fallback = (session.defaultTitle || '').trim() || `session-${index + 1}`;
      session.defaultTitle = fallback;
      session.title = (session.title || '').trim() || fallback;
      session.width = clampCellSize(
        session.width, MIN_CELL_WIDTH, MAX_CELL_WIDTH, DEFAULT_CELL_WIDTH
      );
      session.height = clampCellSize(
        session.height, MIN_CELL_HEIGHT, MAX_CELL_HEIGHT, DEFAULT_CELL_HEIGHT
      );
      return session;
    }

    async function saveSessionTitle(session, rawTitle, sourceEl) {
      const fallback = session.defaultTitle || 'session-1';
      const value = (rawTitle || '').trim() || fallback;
      if (sourceEl) sourceEl.textContent = value;
      session.title = value;

      const backend = getBackendById(session.backendId);
      if (!backend) {
        showToast('后端不存在');
        return false;
      }

      const res = await apiForBackend(backend, sessionApiPath(session), {
        method: 'PATCH',
        body: { title: value },
      });
      if (!res.ok) {
        showToast('保存备注失败');
        return false;
      }

      const data = await res.json();
      session.title = data.title || value;
      session.defaultTitle = data.defaultTitle || session.defaultTitle;

      const cell = grid.querySelector(`.cell[data-id="${session.id}"]`);
      const cellTitle = cell?.querySelector('.cell-title-display');
      if (cellTitle && cellTitle !== sourceEl) {
        cellTitle.textContent = session.title;
      }
      if (overlayTitle !== sourceEl && activeView?.session.id === session.id) {
        overlayTitle.value = session.title;
      }
      if (isMobile && document.body.classList.contains('mobile-pager')) {
        updateMobilePagerChrome();
      }
      return true;
    }

    function attachTitleEditor(session, el) {
      el.addEventListener('blur', () => saveSessionTitle(session, el.textContent, el));
      el.addEventListener('keydown', (e) => {
        e.stopPropagation();
        if (e.key === 'Enter' && !e.shiftKey) {
          e.preventDefault();
          el.blur();
        }
      });
      el.addEventListener('click', (e) => e.stopPropagation());
      el.addEventListener('dblclick', (e) => e.stopPropagation());
    }

    function gridSessionOrder() {
      return [...grid.querySelectorAll('.cell')].map((cell) => cell.dataset.id);
    }

    let orderSaveTimer = null;

    async function persistSessionOrder() {
      const order = gridSessionOrder();
      if (!order.length) return;
      if (hasRemoteBackends()) {
        saveFederatedLayout({ order });
      }
      const localOrder = order
        .map(splitCompositeId)
        .filter(({ backendId }) => backendId === LOCAL_BACKEND_ID)
        .map(({ remoteId }) => remoteId);
      if (!localOrder.length) return;
      try {
        const res = await fetch('/api/sessions/order', {
          ...fetchOpts,
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ order: localOrder }),
        });
        if (!res.ok) {
          const data = await res.json().catch(() => ({}));
          showToast(data.error || '保存排序失败');
        }
      } catch (err) {
        showToast('保存排序失败: ' + err.message);
      }
    }

    function schedulePersistSessionOrder() {
      clearTimeout(orderSaveTimer);
      orderSaveTimer = setTimeout(persistSessionOrder, 300);
    }

    function shouldInsertBefore(dragging, target, x, y) {
      const rect = target.getBoundingClientRect();
      const midX = rect.left + rect.width / 2;
      const midY = rect.top + rect.height / 2;
      const rowThreshold = rect.height * 0.25;
      if (y < midY - rowThreshold) return true;
      if (y > midY + rowThreshold) return false;
      return x < midX;
    }

    function attachDragReorder(cell) {
      const handle = cell.querySelector('.btn-drag');
      if (!handle) return;

      let dragAllowed = false;

      handle.addEventListener('pointerdown', (e) => {
        e.stopPropagation();
        dragAllowed = true;
        handle.setPointerCapture(e.pointerId);
      });

      handle.addEventListener('pointerup', (e) => {
        e.stopPropagation();
        dragAllowed = false;
        if (handle.hasPointerCapture(e.pointerId)) {
          handle.releasePointerCapture(e.pointerId);
        }
      });

      handle.addEventListener('click', (e) => e.stopPropagation());

      cell.addEventListener('dragstart', (e) => {
        if (isMobile) {
          e.preventDefault();
          return;
        }
        if (!dragAllowed) {
          e.preventDefault();
          return;
        }
        e.dataTransfer.effectAllowed = 'move';
        e.dataTransfer.setData('text/plain', cell.dataset.id);
        cell.classList.add('dragging');
        if (e.dataTransfer.setDragImage) {
          e.dataTransfer.setDragImage(cell, 24, 24);
        }
      });

      cell.addEventListener('dragend', () => {
        dragAllowed = false;
        cell.classList.remove('dragging');
        grid.querySelectorAll('.cell.drag-over').forEach((el) => el.classList.remove('drag-over'));
        schedulePersistSessionOrder();
      });

      cell.addEventListener('dragover', (e) => {
        e.preventDefault();
        e.dataTransfer.dropEffect = 'move';
        const dragging = grid.querySelector('.cell.dragging');
        if (!dragging || dragging === cell) return;

        cell.classList.add('drag-over');
        const insertBefore = shouldInsertBefore(dragging, cell, e.clientX, e.clientY);
        if (insertBefore) {
          if (dragging.nextSibling !== cell) {
            grid.insertBefore(dragging, cell);
          }
        } else if (dragging !== cell.nextSibling) {
          grid.insertBefore(dragging, cell.nextSibling);
        }
      });

      cell.addEventListener('dragleave', () => {
        cell.classList.remove('drag-over');
      });

      cell.addEventListener('drop', (e) => {
        e.preventDefault();
        cell.classList.remove('drag-over');
      });

      cell.draggable = true;
    }

    const OVERLAY_BAR_HEIGHT = 49;
    const DEFAULT_CELL_WIDTH = 320;
    const DEFAULT_CELL_HEIGHT = 240;
    const MIN_CELL_WIDTH = 260;
    const MIN_CELL_HEIGHT = 160;
    const MAX_CELL_WIDTH = 960;
    const MAX_CELL_HEIGHT = 720;

    function clampCellSize(value, min, max, fallback) {
      const n = parseInt(value, 10);
      if (!Number.isFinite(n)) return fallback;
      return Math.max(min, Math.min(max, n));
    }

    function applyCellSize(cell, session, width, height) {
      session.width = clampCellSize(width, MIN_CELL_WIDTH, MAX_CELL_WIDTH, DEFAULT_CELL_WIDTH);
      session.height = clampCellSize(height, MIN_CELL_HEIGHT, MAX_CELL_HEIGHT, DEFAULT_CELL_HEIGHT);
      cell.style.width = `${session.width}px`;
      cell.style.height = `${session.height}px`;
    }

    let sizeSaveTimer = null;

    async function persistSessionSize(session) {
      const layout = loadFederatedLayout();
      layout.sizes = layout.sizes || {};
      layout.sizes[session.id] = { width: session.width, height: session.height };
      saveFederatedLayout(layout);
      if (!session.isLocal) return;
      try {
        const backend = getLocalBackend();
        const res = await apiForBackend(backend, sessionApiPath(session), {
          method: 'PATCH',
          body: { width: session.width, height: session.height },
        });
        if (!res.ok) {
          const data = await res.json().catch(() => ({}));
          showToast(data.error || '保存窗口大小失败');
        }
      } catch (err) {
        showToast('保存窗口大小失败: ' + err.message);
      }
    }

    function schedulePersistSessionSize(session) {
      clearTimeout(sizeSaveTimer);
      sizeSaveTimer = setTimeout(() => persistSessionSize(session), 300);
    }

    function attachCellResize(cell, session) {
      const handle = document.createElement('div');
      handle.className = 'cell-resize-handle';
      handle.title = '拖动调整窗口大小';
      handle.setAttribute('aria-label', '拖动调整窗口大小');
      cell.appendChild(handle);

      let startX = 0;
      let startY = 0;
      let startW = 0;
      let startH = 0;

      handle.addEventListener('pointerdown', (e) => {
        if (isMobile || cell.classList.contains('expanded')) return;
        e.preventDefault();
        e.stopPropagation();
        startX = e.clientX;
        startY = e.clientY;
        startW = cell.offsetWidth;
        startH = cell.offsetHeight;
        cell.classList.add('resizing');
        handle.setPointerCapture(e.pointerId);

        const onMove = (ev) => {
          const width = startW + (ev.clientX - startX);
          const height = startH + (ev.clientY - startY);
          applyCellSize(cell, session, width, height);
          if (!cell.classList.contains('minimized') || cell.classList.contains('minimized-active')) {
            fitFrameToGrid(cell);
          }
        };

        const onUp = (ev) => {
          if (handle.hasPointerCapture(ev.pointerId)) {
            handle.releasePointerCapture(ev.pointerId);
          }
          cell.classList.remove('resizing');
          handle.removeEventListener('pointermove', onMove);
          handle.removeEventListener('pointerup', onUp);
          handle.removeEventListener('pointercancel', onUp);
          schedulePersistSessionSize(session);
          if (cell.classList.contains('minimized-active')) {
            requestAnimationFrame(() => fitFrameToGrid(cell));
          }
        };

        handle.addEventListener('pointermove', onMove);
        handle.addEventListener('pointerup', onUp);
        handle.addEventListener('pointercancel', onUp);
      });
    }

    function syncPlaceholderSize(placeholder, cell) {
      placeholder.style.width = `${cell.offsetWidth}px`;
      placeholder.style.height = `${cell.offsetHeight}px`;
    }

    function getExpandedTerminalSize() {
      return {
        width: window.innerWidth,
        height: Math.max(200, window.innerHeight - OVERLAY_BAR_HEIGHT),
      };
    }

    function ensureTerminalFrame(cell) {
      let viewport = cell.querySelector('.terminal-viewport');
      if (viewport) {
        return {
          viewport,
          frame: viewport.querySelector('.terminal-frame'),
          iframe: viewport.querySelector('iframe'),
        };
      }

      const iframe = cell.querySelector('iframe');
      viewport = document.createElement('div');
      viewport.className = 'terminal-viewport';
      const frame = document.createElement('div');
      frame.className = 'terminal-frame';
      if (iframe) {
        frame.appendChild(iframe);
      } else {
        const created = document.createElement('iframe');
        frame.appendChild(created);
      }
      viewport.appendChild(frame);
      cell.appendChild(viewport);
      return {
        viewport,
        frame,
        iframe: frame.querySelector('iframe'),
      };
    }

    function rememberExpandedSize(frame, width, height) {
      frame.dataset.expandedWidth = String(width);
      frame.dataset.expandedHeight = String(height);
    }

    function setFrameSize(frame, width, height) {
      frame.style.width = `${width}px`;
      frame.style.height = `${height}px`;
    }

    function fitFrameToGrid(cell) {
      const { viewport, frame } = ensureTerminalFrame(cell);
      const width = Math.max(1, viewport.clientWidth);
      const height = Math.max(1, viewport.clientHeight);
      setFrameSize(frame, width, height);
      frame.style.transform = 'none';
    }

    function expandTerminalFrame(cell) {
      const { frame, viewport } = ensureTerminalFrame(cell);
      let width;
      let height;
      if (cell.classList.contains('expanded')) {
        width = Math.max(1, viewport.clientWidth);
        height = Math.max(1, viewport.clientHeight);
      } else {
        const size = getExpandedTerminalSize();
        width = size.width;
        height = size.height;
      }
      setFrameSize(frame, width, height);
      rememberExpandedSize(frame, width, height);
      frame.style.transform = 'none';
      cell.classList.remove('minimized');
    }

    function repaintMinimizedTerminal(cell) {
      bumpRecency(cell.dataset.id);
      fitFrameToGrid(cell);
      cell.classList.add('minimized-active');
      requestAnimationFrame(() => {
        fitFrameToGrid(cell);
        const { iframe } = ensureTerminalFrame(cell);
        iframe.focus();
      });
    }

    function minimizeSession(view = activeView) {
      if (!view) return;

      const { cell, placeholder, session } = view;
      cell.classList.remove('expanded');
      cell.classList.remove('minimized-active');
      placeholder?.remove();
      activeView = null;
      overlay.classList.remove('active');
      document.body.classList.remove('session-expanded');

      requestAnimationFrame(() => {
        applyCellSize(cell, session, session.width, session.height);
        fitFrameToGrid(cell);
        cell.classList.add('minimized');
      });
    }

    function openSession(session, cell) {
      if (isMobile) {
        enterMobilePager(cell);
        return;
      }
      bumpRecency(session.id);
      if (activeView?.cell === cell) return;

      if (activeView) {
        minimizeSession(activeView);
      }

      cell.classList.remove('minimized');
      cell.classList.remove('minimized-active');

      const placeholder = document.createElement('div');
      placeholder.className = 'cell-placeholder';
      placeholder.setAttribute('aria-hidden', 'true');
      syncPlaceholderSize(placeholder, cell);
      cell.parentNode.insertBefore(placeholder, cell);

      activeView = { session, cell, placeholder };

      overlayTitle.value = session.title || session.defaultTitle || 'session';
      updateOverlayRecencyTag();
      overlay.classList.add('active');
      document.body.classList.add('session-expanded');
      cell.style.width = '';
      cell.style.height = '';
      cell.classList.add('expanded');

      requestAnimationFrame(() => {
        expandTerminalFrame(cell);
        requestAnimationFrame(() => expandTerminalFrame(cell));
      });
    }

    function closeOverlay() {
      minimizeSession();
    }

    function createCell(session, index) {
      normalizeSession(session, index);
      const label = session.title;

      const cell = document.createElement('div');
      cell.className = 'cell';
      cell.dataset.id = session.id;
      cell.dataset.backendName = session.backendName || '';
      applyCellSize(cell, session, session.width, session.height);

      const header = document.createElement('div');
      header.className = 'cell-header';

      const recencyTagEl = document.createElement('span');
      recencyTagEl.className = 'cell-recency-tag';
      recencyTagEl.setAttribute('aria-label', '操作序号');
      header.appendChild(recencyTagEl);

      const titleEl = document.createElement('div');
      titleEl.className = 'cell-title-display';
      titleEl.contentEditable = 'true';
      titleEl.spellcheck = false;
      titleEl.textContent = label;
      titleEl.dataset.default = session.defaultTitle;
      titleEl.title = '点击编辑备注';
      attachTitleEditor(session, titleEl);
      header.appendChild(titleEl);

      if (hasRemoteBackends()) {
        const backendTag = document.createElement('span');
        backendTag.className = 'cell-backend-tag';
        backendTag.textContent = session.backendName || '本机';
